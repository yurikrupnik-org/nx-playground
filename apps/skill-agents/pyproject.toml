[tool.coverage.run]
branch = true
source = [ "skill_agents" ]

[tool.coverage.report]
exclude_lines = [ "if TYPE_CHECKING:" ]
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../coverage/apps/skill-agents/html'
 --cov-report xml:'../../coverage/apps/skill-agents/coverage.xml'
 --html='../../reports/apps/skill-agents/unittests/html/index.html'
 --junitxml='../../reports/apps/skill-agents/unittests/junit.xml'
"""

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
exclude = [ ".ruff_cache", ".svn", ".tox", ".venv", "dist" ]
line-length = 88
indent-width = 4

  [tool.ruff.lint]
  select = [ "E", "F", "UP", "B", "SIM", "I" ]
  ignore = [ ]
  fixable = [ "ALL" ]
  unfixable = [ ]

[project]
name = "skill-agents"
version = "0.1.0"
description = "Multi-stage supervisors (Google ADK and LangGraph) over the exported standalone ADK skill agents."
requires-python = ">=3.10,<4"
readme = "README.md"
dependencies = [
  "google-adk>=1.0.0",
  "langgraph>=0.6.0",
  "langchain-google-genai>=2.1.0",
]

[project.scripts]
skill-agents = "skill_agents.cli:main"

[build-system]
requires = [ "uv_build>=0.8.9,<0.9.0" ]
build-backend = "uv_build"
