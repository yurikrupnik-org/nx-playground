# Local-only (Tilt) relaxations for the dev image (manifests/dockers/rust.dev.Dockerfile).
# The prod-hardened base is incompatible with the Tilt live-dev flow:
#   * restart_process bakes /tmp/.restart-proc into the image and `entr` watches it;
#     an emptyDir on /tmp masks that file -> entr: "No regular files to watch" -> crashloop.
#   * live_update recompiles in-container (`cargo` writes /app/target + /root/.cargo),
#     which needs a writable rootfs and root ownership.
# This image is explicitly not shipped; prod keeps the hardened base untouched.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zerg-email-nats
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        fsGroup: 0
      containers:
        - name: zerg-email-nats
          securityContext:
            readOnlyRootFilesystem: false
            runAsNonRoot: false
            runAsUser: 0
            capabilities:
              # root with drop:[ALL] still can't chown; Tilt's `sync` untars with
              # --same-owner and needs CHOWN. DAC_OVERRIDE/FOWNER cover writes to
              # baked root-owned paths during in-container cargo builds.
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
          # In-container `cargo`/`rustc` linking needs GB; the prod 256Mi limit
          # OOM-kills (exit 137) the live_update build. Dev-only headroom.
          resources:
            requests:
              memory: "512Mi"
            limits:
              memory: "6Gi"
          volumeMounts:
            - name: tmp
              $patch: delete
      volumes:
        - name: tmp
          $patch: delete
