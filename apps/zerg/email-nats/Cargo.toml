[package]
name = "zerg_email_nats"
publish = false
# Concrete, not `version.workspace = true`: .github/workflows/release.yml reads and
# sed-bumps this literal line for every project with a container target.
version = "0.1.1"
edition.workspace = true
description = "Email worker service using NATS JetStream"
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "zerg_email_nats"
path = "src/main.rs"

[dependencies]
# NATS client
async-nats = { workspace = true }

# HTTP server for health
axum = { workspace = true }

# Core configuration
core_config = { workspace = true }

# Email library (with NATS support and both providers)
email = { workspace = true, features = ["smtp", "sendgrid"] }

# Error handling
eyre = { workspace = true }

# Messaging with NATS support
messaging = { workspace = true, features = ["nats"] }

# Async runtime
tokio = { workspace = true, features = ["full", "signal"] }

# Observability
tracing = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
# Throwaway NATS container for tests/examples_it.rs, which runs the publisher
# examples as real processes.
test-utils = { workspace = true, features = ["nats"] }

[[example]]
name = "publish_test"
path = "examples/publish_test.rs"

[[example]]
name = "publish_bulk"
path = "examples/publish_bulk.rs"

[lints]
workspace = true
