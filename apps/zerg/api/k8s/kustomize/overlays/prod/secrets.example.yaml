apiVersion: v1
kind: Secret
metadata:
  name: zerg-api-secrets
  namespace: zerg
type: Opaque
stringData:
  # WorkOS AuthKit credentials (dashboard -> Applications). Social login is
  # brokered by WorkOS, so no GOOGLE_*/GITHUB_* secrets are needed anymore.
  WORKOS_CLIENT_ID: "client_your-workos-client-id"
  WORKOS_API_KEY: "sk_your-workos-api-key"
  FLAGSMITH_ENVIRONMENT_KEY: "your-flagsmith-environment-key"
