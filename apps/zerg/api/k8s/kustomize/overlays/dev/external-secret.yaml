apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zerg-api-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: zerg-api-secrets
    creationPolicy: Owner
  data:
    # WorkOS AuthKit (BFF auth via oidc-auth); social login is brokered by WorkOS,
    # so no GOOGLE_*/GITHUB_* secrets are needed here anymore.
    - secretKey: WORKOS_CLIENT_ID
      remoteRef:
        key: app-secrets
        property: zerg.workos_client_id
    - secretKey: WORKOS_API_KEY
      remoteRef:
        key: app-secrets
        property: zerg.workos_api_key
#    - secretKey: FLAGSMITH_ENVIRONMENT_KEY
#      remoteRef:
#        key: app-secrets
#        property: zerg-api.flagsmith_environment_key
