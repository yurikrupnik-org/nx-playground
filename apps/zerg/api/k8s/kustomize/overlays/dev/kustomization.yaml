apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: zerg

# zerg-api local/dev (Tilt). Consumes the shared backend core and patches
# zerg-api identity, image, and env. NOTE: Flux dev+prod use overlays/prod
# (see gitops-v1), so this overlay is the local-only path — safe to base on
# the shared core without touching any cluster-managed Deployment selector.
resources:
#  - ../../../../../../../manifests/apps/core/backend
  - ../../base
  # - external-secret.yaml

#patches:
#  - path: tilt-dev-patch.yaml
  # - database.yaml

# identity: stable selector label, then descriptive labels (metadata + template).
labels:
  - pairs:
      app.kubernetes.io/name: zerg-api
    includeSelectors: true
  - pairs:
      app.kubernetes.io/component: api-server
      app.kubernetes.io/part-of: zerg
      app.kubernetes.io/version: "0.1.0"
    includeTemplates: true

# local image built by Tilt.
#images:
#  - name: zerg-api
#    newName: yurikrupnik/zerg-api
#    newTag: main

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: zerg-api-config
    literals:
      - PORT=8080
      - CORS_ALLOWED_ORIGIN=http://localhost:5206,https://127.0.0.1.nip.io:8443
      - REDIRECT_BASE_URL=http://localhost:5206
      - FRONTEND_URL=http://localhost:5206
      - FLAGSMITH_API_URL=http://flagsmith-api.flagsmith.svc.cluster.local:8000/api/v1
      # Same-namespace short DNS — works wherever the Kustomization lands.
      - TASKS_SERVICE_ADDR=http://zerg-tasks:50051
secretGenerator:
  - name: zerg-api-secrets
    literals:
      - DATABASE_URL=postgres://myuser:mypassword@postgres.dbs.svc.cluster.local/zerg
      # WorkOS AuthKit creds — replace with your environment's values (dev only;
      # real deployments use the ExternalSecret instead).
      - WORKOS_CLIENT_ID=client_replace-me
      - WORKOS_API_KEY=sk_replace-me

