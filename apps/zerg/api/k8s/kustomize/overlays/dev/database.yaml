# zerg-api's dedicated DB (local dev → CNPG). The same XR on GKE would carry
# `db.platform/backend: cloudsql` to get Cloud SQL instead — identical app contract.
apiVersion: platform.internal/v1alpha1
kind: Database
metadata:
  name: zerg-api
spec:
  crossplane:
    compositionSelector:
      matchLabels:
        db.platform/backend: cnpg
  engine: postgres
  version: "16"
  storageGB: 10
  database: zerg
  owner: zerg
  connectionSecretName: zerg-api-db
