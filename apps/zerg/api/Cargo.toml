[package]
name = "zerg_api"
publish = false
# Concrete, not `version.workspace = true`: .github/workflows/release.yml reads and
# sed-bumps this literal line for every project with a container target.
version = "0.1.2"
edition.workspace = true

[[bin]]
name = "zerg_api"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
axum-helpers = { workspace = true }
chrono = { workspace = true }
color-eyre = { workspace = true }
contract_tasks = { workspace = true }
core_config = { workspace = true }
database = { workspace = true, features = ["all"] }
domain_cloud_resources = { workspace = true }
domain_projects = { workspace = true }
domain_users = { workspace = true }
domain_vector = { workspace = true }
email = { workspace = true }
eyre = { workspace = true }
grpc-client = { workspace = true }
messaging = { workspace = true, features = ["nats"] }
oidc-auth = { workspace = true }
redis = { workspace = true }
rpc = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
tonic-health = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }

[lints]
workspace = true
