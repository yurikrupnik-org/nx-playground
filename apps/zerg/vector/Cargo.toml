[package]
name = "zerg_vector"
publish = false
# Concrete, not `version.workspace = true`: .github/workflows/release.yml reads and
# sed-bumps this literal line for every project with a container target.
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "zerg_vector"
path = "src/main.rs"

[dependencies]
core_config = { workspace = true }
domain_vector = { workspace = true }
eyre = { workspace = true }
grpc-client = { workspace = true, features = ["server"] }
rpc = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
