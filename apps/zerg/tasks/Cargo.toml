[package]
name = "zerg_tasks"
publish = false
version = "0.1.1"
edition = "2024"

[[bin]]
name = "zerg_tasks"
path = "src/main.rs"

[dependencies]
chrono = { workspace = true }
core_config = { workspace = true }
database = { workspace = true, features = ["config"] }
contract_tasks = { workspace = true }
domain_tasks = { path = "../../../libs/domains/tasks" }
oidc-auth = { workspace = true }
eyre = { workspace = true }
grpc-client = { path = "../../../libs/core/grpc", features = ["server"] }
rpc = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
parking_lot = { workspace = true }
