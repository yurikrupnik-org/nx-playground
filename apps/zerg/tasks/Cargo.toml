[package]
name = "zerg_tasks"
publish = false
# Concrete, not `version.workspace = true`: .github/workflows/release.yml reads and
# sed-bumps this literal line for every project with a container target.
version = "0.1.1"
edition.workspace = true

[[bin]]
name = "zerg_tasks"
path = "src/main.rs"

[dependencies]
chrono = { workspace = true }
contract_tasks = { workspace = true }
core_config = { workspace = true }
database = { workspace = true, features = ["config"] }
domain_tasks = { workspace = true }
eyre = { workspace = true }
grpc-client = { workspace = true, features = ["server"] }
oidc-auth = { workspace = true }
rpc = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
parking_lot = { workspace = true }

[lints]
workspace = true
