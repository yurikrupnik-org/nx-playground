apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# namespace omitted — Flux's parent Kustomization sets targetNamespace.
namespace: zerg
resources:
  - ../../base

#patches:
#  - path: tilt-dev-patch.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: zerg-tasks-config
    literals:
      - GRPC_HOST=0.0.0.0
      - GRPC_PORT=50051
