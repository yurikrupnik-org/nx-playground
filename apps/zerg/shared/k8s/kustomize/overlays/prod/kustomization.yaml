apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: zerg

resources:
  - external-secret.yaml
  - ../../../../../email-nats/k8s/kustomize/overlays/dev # todo change back to prod - testing with mailhog still

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: zerg-shared-config
    literals:
      - APP_ENV=production
      - RUST_LOG=info
      - NATS_URL=nats://nats.nats-system.svc.cluster.local:4222
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector.monitoring.svc.cluster.local:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - REDIS_HOST=redis://redis-redis-redis.dbs.svc.cluster.local:6379
      - QDRANT_URL=http://qdrant-qdrant-qdrant.dbs.svc.cluster.local:6334
      - DB_MAX_CONNECTIONS=10
      - DB_MIN_CONNECTIONS=2
      - DB_ACQUIRE_TIMEOUT_SECS=5
      - DB_IDLE_TIMEOUT_SECS=300
      - DB_MAX_LIFETIME_SECS=1800
      - DB_SQLX_LOGGING=false
