apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: zerg

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
#  - name: zerg-api-config
#    literals:
#      - PORT=8080
#      - CORS_ALLOWED_ORIGIN=http://localhost:5206,https://127.0.0.1.nip.io:8443
#      - REDIRECT_BASE_URL=http://localhost:5206
#      - FRONTEND_URL=http://localhost:5206
#      - OAUTH_AUTO_LINK_VERIFIED_EMAILS=true
#      - FLAGSMITH_API_URL=http://flagsmith-api.flagsmith.svc.cluster.local:8000/api/v1
#      - # Same-namespace short DNS — works wherever the Kustomization lands.
#      - TASKS_SERVICE_ADDR=http://zerg-tasks:50051
  - name: zerg-shared-config
    literals:
      - APP_ENV=dev
      - RUST_LOG=info
      - NATS_URL=nats://nats.dbs.svc.cluster.local:4222
#      - NATS_URL=nats://nats.nats-system.svc.cluster.local:4222
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector.monitoring.svc.cluster.local:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - REDIS_HOST=redis://redis.dbs.svc.cluster.local
      - DB_MAX_CONNECTIONS=10
      - DB_MIN_CONNECTIONS=2
      - DB_ACQUIRE_TIMEOUT_SECS=5
      - DB_IDLE_TIMEOUT_SECS=300
      - DB_MAX_LIFETIME_SECS=1800
      - DB_SQLX_LOGGING=false
      - RATE_LIMIT_REQUESTS_PER_WINDOW=100
      - RATE_LIMIT_WINDOW_SECS=60
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_VECTOR_REQUESTS_PER_WINDOW=20
      - RATE_LIMIT_VECTOR_WINDOW_SECS=60
      - RATE_LIMIT_AUTH_REQUESTS_PER_WINDOW=10
      - RATE_LIMIT_AUTH_WINDOW_SECS=60

secretGenerator:
  - name: zerg-shared-secrets
    # Local dev secrets only (JWT_SECRET, OAuth + API keys). Gitignored; generated
    # from the repo-root .env (secrets only — connection addresses stay in the
    # configmap with in-cluster DNS, so they are NOT shadowed here). `envs:` parses
    # KEY=VALUE lines; `files:` would store the whole file under one key.
    envs:
      - secrets.env
