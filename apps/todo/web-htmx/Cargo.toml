[package]
name = "todo_web_htmx"
publish = false
# Concrete, not `version.workspace = true`: .github/workflows/release.yml reads and
# sed-bumps this literal line for every project with a container target.
version = "0.1.0"
edition.workspace = true
description = "Todo hypermedia frontend: axum renders the HTML + htmx fragments itself, over todo-api JSON"

[[bin]]
name = "todo_web_htmx"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
axum-helpers = { workspace = true }
core_config = { workspace = true }
eyre = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full", "signal"] }
tower-http = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
