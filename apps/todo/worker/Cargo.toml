[package]
name = "todo_worker"
publish = false
version = "0.1.0"
edition = "2021"
description = "Todo event worker: consumes todos.> from NATS JetStream and processes lifecycle events"

[lib]
path = "src/lib.rs"

[[bin]]
name = "todo_worker"
path = "src/main.rs"

[dependencies]
async-trait = { workspace = true }
core_config = { workspace = true }
domain_todo = { path = "../../../libs/domains/todo" }
eyre = { workspace = true }
messaging = { workspace = true, features = ["nats"] }
tokio = { workspace = true, features = ["full", "signal"] }
tracing = { workspace = true }

[dev-dependencies]
async-nats = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
test-utils = { workspace = true, features = ["nats"] }
uuid = { workspace = true }
