[package]
name = "todo_temporal"
publish = false
# Concrete, not `version.workspace = true`: .github/workflows/release.yml reads and
# sed-bumps this literal line for every project with a container target.
version = "0.1.0"
edition.workspace = true
description = "Todo lifecycle on Temporal: workflow-as-entity worker + starter, publishing todos.> events to NATS JetStream"

[lib]
path = "src/lib.rs"

[[bin]]
name = "todo_temporal"
path = "src/main.rs"

[[bin]]
name = "todo_temporal_starter"
path = "src/starter.rs"

[dependencies]
chrono = { workspace = true }
core_config = { workspace = true }
domain_todo = { workspace = true }
eyre = { workspace = true }
futures = { workspace = true }
messaging = { workspace = true, features = ["nats"] }
serde = { workspace = true }
temporalio-client = { workspace = true }
temporalio-common = { workspace = true }
temporalio-macros = { workspace = true }
temporalio-sdk = { workspace = true }
temporalio-workflow = { workspace = true }
tokio = { workspace = true, features = ["full", "signal"] }
tracing = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
