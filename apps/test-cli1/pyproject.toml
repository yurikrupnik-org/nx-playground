[tool.coverage.run]
branch = true
source = [ "test_cli1" ]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../coverage/apps/test-cli1/html'
 --cov-report xml:'../../coverage/apps/test-cli1/coverage.xml'
 --html='../../reports/apps/test-cli1/unittests/html/index.html'
 --junitxml='../../reports/apps/test-cli1/unittests/junit.xml'
"""

[project]
name = "test-cli1"
version = "1.0.0"
description = "Automatically generated by Nx."
# >=3.10, not the generator's >=3.9: a 3.9 floor forces uv to keep a second
# resolution fork pinned to pytest 8.4.2 (pytest 9 requires >=3.10), and 8.4.x
# carries PYSEC-2026-1845 with no 8.x fix. 3.9 is EOL anyway.
requires-python = ">=3.10,<4"
readme = 'README.md'
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["test_cli1"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
  "autopep8>=2.3.1",
  "ruff>=0.8.2",
  "pytest>=8.3.4",
  "pytest-sugar>=1.0.0",
  "pytest-cov>=6.0.0",
  "pytest-html>=4.1.1",
]

[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"

# The package is `test_cli1/` at the project root, not `src/test_cli1/`; uv_build
# assumes a src layout and fails the editable install without this.
[tool.uv.build-backend]
module-root = ""

[tool.ruff]
exclude = [
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "dist",
]

line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
]
ignore = []

fixable = ["ALL"]
unfixable = []
