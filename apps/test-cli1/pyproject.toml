[tool.coverage.run]
branch = true
source = [ "test_cli1" ]

[tool.coverage.report]
exclude_lines = [ "if TYPE_CHECKING:" ]
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../coverage/apps/test-cli1/html'
 --cov-report xml:'../../coverage/apps/test-cli1/coverage.xml'
 --html='../../reports/apps/test-cli1/unittests/html/index.html'
 --junitxml='../../reports/apps/test-cli1/unittests/junit.xml'
"""

[tool.hatch.build.targets.wheel]
packages = [ "test_cli1" ]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
exclude = [ ".ruff_cache", ".svn", ".tox", ".venv", "dist" ]
line-length = 88
indent-width = 4

  [tool.ruff.lint]
  select = [ "E", "F", "UP", "B", "SIM", "I" ]
  ignore = [ ]
  fixable = [ "ALL" ]
  unfixable = [ ]

[project]
name = "test-cli1"
version = "1.0.0"
description = "Automatically generated by Nx."
requires-python = ">=3.10,<4"
readme = "README.md"
dependencies = [ ]

[build-system]
requires = [ "uv_build>=0.8.9,<0.9.0" ]
build-backend = "uv_build"
