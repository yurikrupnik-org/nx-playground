[package]
name = "taskgraph_api"
publish = false
# Concrete, not `version.workspace = true`: .github/workflows/release.yml reads and
# sed-bumps this literal line for every project with a container target.
version = "0.1.0"
edition.workspace = true
description = "Taskgraph read model: folds the TASKGRAPH event stream into Taskfile drill-down, run timelines and estimates; REST + SSE + Prometheus + embedded UI"

[[bin]]
name = "taskgraph_api"
path = "src/main.rs"

[dependencies]
async-nats = { workspace = true }
axum = { workspace = true }
axum-helpers = { workspace = true }
contract_taskgraph = { workspace = true }
core_config = { workspace = true }
domain_taskgraph = { workspace = true }
eyre = { workspace = true }
futures = { workspace = true }
messaging = { workspace = true, features = ["nats"] }
metrics = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
chrono = { workspace = true }
reqwest = { workspace = true }
test-utils = { workspace = true, features = ["nats"] }

[lints]
workspace = true
