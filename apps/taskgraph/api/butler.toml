# Tilt/k8s config for this app. Repo-wide defaults live in the root butler.toml.
# Image build inputs are NOT here: they follow the repo convention in the root
# butler.toml, which also drives this app's nx `container`/`scan` targets.

[tilt]
hostPort = 5262

# The k8s workload, rendered by the `app` KCL package. This table is the whole
# app-local k8s surface: everything the root `[workloadDefaults.service]` shape
# already states is omitted, and `image`/`name`/`namespace`/`partOf` are injected
# by butler from the image facts and this app's path.
[workload]
component = "backend"
# Serves /metrics (axum_helpers::metrics_router + taskgraph_* series).
prometheus = true
# Stateless reads over an in-memory projection; nothing in flight to drain.
terminationGracePeriodSeconds = 10

# The projection holds at most 1000 runs and 200 samples per task.
[workload.resources]
requests = { memory = "32Mi", cpu = "50m" }
limits = { memory = "256Mi", cpu = "500m" }

# /healthz is liveness only. 12 * 5s = up to 60s to reach NATS
# (jetstream_with_retry) before liveness starts restarting.
[workload.startupProbe]
path = "/healthz"
port = "http"
initialDelaySeconds = 2
periodSeconds = 5
failureThreshold = 12

[workload.livenessProbe]
path = "/healthz"
port = "http"

# /readyz turns green only once the TASKGRAPH replay has caught up, so a
# half-built drill-down is never served.
[workload.readinessProbe]
path = "/readyz"
port = "http"
periodSeconds = 5

[[workload.env]]
name = "NATS_URL"
value = "nats://nats.dbs.svc.cluster.local:4222"

[[workload.env]]
name = "APP_ENV"
value = "development"
