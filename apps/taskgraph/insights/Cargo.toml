[package]
name = "taskgraph_insights"
publish = false
# Concrete, not `version.workspace = true`: .github/workflows/release.yml reads and
# sed-bumps this literal line for every project with a container target.
version = "0.1.0"
edition.workspace = true
description = "Insights sync service: pulls GitHub Actions runs/jobs/steps, commits and CI artifacts into Postgres `insights`, drains TASKGRAPH into it and exports CI runs as OTLP traces"

[[bin]]
name = "taskgraph_insights"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
axum-helpers = { workspace = true }
clap = { workspace = true }
core_config = { workspace = true }
domain_insights = { workspace = true }
eyre = { workspace = true }
messaging = { workspace = true, features = ["nats"] }
metrics = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
