# Tilt/k8s config for this app. Repo-wide defaults live in the root butler.toml.
# Image build inputs are NOT here: they follow the repo convention in the root
# butler.toml, which also drives this app's nx `container`/`scan` targets.

[tilt]
hostPort = 5263

# The k8s workload, rendered by the `app` KCL package. This table is the whole
# app-local k8s surface: everything the root `[workloadDefaults.service]` shape
# already states is omitted, and `image`/`name`/`namespace`/`partOf` are injected
# by butler from the image facts and this app's path.
[workload]
component = "backend"
# Serves /metrics (axum_helpers::metrics_router + insights_* series).
prometheus = true

# One sync cycle at a time; the backfill holds a few hundred runs/commits.
[workload.resources]
requests = { memory = "64Mi", cpu = "50m" }
limits = { memory = "256Mi", cpu = "500m" }

# /healthz is liveness only; startup is a Postgres connect plus a bounded NATS
# connect.
[workload.startupProbe]
path = "/healthz"
port = "http"
initialDelaySeconds = 2
periodSeconds = 5
failureThreshold = 12

[workload.livenessProbe]
path = "/healthz"
port = "http"

# /readyz turns green once one sync cycle finished with no failed stage.
[workload.readinessProbe]
path = "/readyz"
port = "http"
periodSeconds = 10

# DATABASE_URL + GITHUB_TOKEN. Never committed: `task insights-secret` creates
# it from `gh auth token` and the dev Postgres URL. Optional (the package
# default for secrets), so the pod starts and reports the missing keys.
[[workload.envFrom]]
kind = "secret"
name = "taskgraph-insights-secrets"

[[workload.env]]
name = "GITHUB_REPOSITORY"
value = "yurikrupnik-org/nx-playground"

[[workload.env]]
name = "NATS_URL"
value = "nats://nats.dbs.svc.cluster.local:4222"

[[workload.env]]
name = "OTEL_EXPORTER_OTLP_ENDPOINT"
value = "http://otel-collector.monitoring.svc.cluster.local:4317"

[[workload.env]]
name = "INSIGHTS_SYNC_INTERVAL"
value = "10m"

[[workload.env]]
name = "INSIGHTS_BACKFILL_DAYS"
value = "90"

[[workload.env]]
name = "INSIGHTS_CI_WORKFLOWS"
value = ".github/workflows/ci-optimized.yml"

[[workload.env]]
name = "APP_ENV"
value = "development"
