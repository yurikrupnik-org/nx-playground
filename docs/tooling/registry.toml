# Infrastructure / platform tool registry — see .claude/skills/cncf-manager/SKILL.md
#
# One row per tool below the app line. `status` is a claim the drift audit must
# be able to reproduce from `install` + `usage` + `gate`; a row whose paths no
# longer exist is a defect, not documentation.
#
# Deliberately NO line numbers: they rot within a commit. Cite the file plus the
# grep token (`key`) that pins the fact.
#
# Legend — status:
#   adopted   install + usage + gate all present in THIS repo
#   trial     wired behind one app/flag, `review` date set
#   candidate scored, not wired
#   rejected  evaluated and refused (row stays so it is not re-litigated)
#   external  real, but installed by another repo/cluster (gitops-v1, devkit);
#             this repo may reference it, MUST NOT install it
#   claimed   named in prose with zero install and zero usage — a defect
#
# Audited 2026-09-19 (repo evidence only, no cluster reachable).

################################################################################
# Declared gaps — the ONLY sanctioned reason an `adopted` row may carry
# `gate = "none"`. Every gap needs an owner and a closing condition; anything
# ungated and undeclared is a defect the drift audit must report.
################################################################################

[[gap]]
name = "no-cluster-in-ci"
applies_to = ["kind", "crossplane-provider-kubernetes", "crossplane-provider-helm", "function-kcl", "function-auto-ready", "cloudnative-pg", "atlas-operator", "atlas-cli", "helm", "vals", "gcp-secret-manager", "mailhog"]
why = "Nothing in `task verify` or the CI matrix starts a cluster, so no operator, CRD consumer or secret path is exercised. k8s-check/tilt-check/graph-check only prove the RENDER is in sync, never that it applies."
closes_when = "a kind-based smoke job applies manifests/k8s and waits for the operators' CRs to go Ready"
owner = "scope:infra"

[[gap]]
name = "host-tool"
applies_to = ["mprocs", "bacon"]
why = "Developer conveniences with no artifact; breakage is local and immediate."
closes_when = "never — accepted"
owner = "scope:infra"

[[gap]]
name = "saas-no-assertion"
applies_to = ["claude-code-action", "workos", "coderabbit", "codex-cli"]
why = "External services nothing in the repo can assert against without live credentials."
closes_when = "an integration test behind a credentialed CI job, or the dependency is removed"
owner = "scope:infra"

[[gap]]
name = "cache-only"
applies_to = ["sccache"]
why = "A miss only slows CI; there is no correctness claim a gate could defend."
closes_when = "never — accepted (revisit if a cache poisoning path appears)"
owner = "scope:infra"

[[gap]]
name = "docs-not-gated"
applies_to = ["monodocs"]
why = "`docs-lint` is red by construction — 36 of 60 discovered projects have no README — and the rendered document goes to gitignored `dist/`, so no recipe in `check`/`verify` runs monodocs at all."
closes_when = "the README backlog closes and `docs-lint` joins `task verify`, or a document is committed and gated with `monodocs build --check` (what the tool's home repo does)"
owner = "scope:infra"

