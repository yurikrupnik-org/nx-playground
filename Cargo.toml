
[workspace]
resolver = '2'
members = [
    'apps/butler/cli',
    'apps/terran/api',
    'apps/todo/api',
    'apps/todo/cli',
    'apps/todo/temporal',
    'apps/todo/web-htmx',
    'apps/todo/worker',
    'apps/zerg/api',
    'apps/zerg/email-nats',
    'apps/zerg/tasks',
    'apps/zerg/vector',
    'libs/contracts/projects',
    'libs/contracts/tasks',
    'libs/core/axum-helpers',
    'libs/core/config',
    'libs/core/feature-flags',
    'libs/core/field-selector',
    'libs/core/grpc',
    'libs/core/messaging',
    'libs/core/oidc-auth',
    'libs/core/proc_macros',
    'libs/core/proc_macros/api_resource',
    'libs/core/proc_macros/sea_orm_resource',
    'libs/core/proc_macros/selectable_fields',
    'libs/core/retry',
    'libs/core/strings',
    'libs/database',
    'libs/domains/cloud_resources',
    'libs/domains/projects',
    'libs/domains/tasks',
    'libs/domains/todo',
    'libs/domains/users',
    'libs/domains/vector',
    'libs/lols',
    'libs/native/field-selector',
    'libs/notifications/email',
    'libs/patterns/builder',
    'libs/patterns/iterator',
    'libs/patterns/newtype',
    'libs/patterns/option_result',
    'libs/patterns/playing',
    'libs/patterns/state',
    'libs/patterns/strategy',
    'libs/patterns/type_state',
    'libs/platform/devenv-sdk',
    'libs/rpc',
    'libs/testing/test-utils',
]

[workspace.dependencies]
api_resource = { path = 'libs/core/proc_macros/api_resource', version = '0.1.0' }
async-nats = '0.50.0'
async-trait = '0.1.92'
axum = { version = '0.8.9', features = ['default', 'tracing', 'ws'] }
axum-extra = { version = '0.12.6', features = ['typed-header'] }
axum-helpers = { path = 'libs/core/axum-helpers' }
base64 = '0.23.1'
chrono = { version = '0.4.45', features = ['serde'] }
clap = { version = '4.6.6', features = ['derive'] }
color-eyre = '0.6.5'
contract_projects = { path = 'libs/contracts/projects' }
contract_tasks = { path = 'libs/contracts/tasks' }
core_config = { path = 'libs/core/config', version = '0.1.0' }
core_proc_macros = { path = 'libs/core/proc_macros' }
core_retry = { path = 'libs/core/retry' }
core_strings = { path = 'libs/core/strings', version = '0.1.0' }
#crossfile = { version = '3.1' }
darling = '0.24.1'
database = { path = 'libs/database' }
domain_cloud_resources = { path = 'libs/domains/cloud_resources' }
domain_projects = { path = 'libs/domains/projects' }
domain_tasks = { path = 'libs/domains/tasks' }
domain_todo = { path = 'libs/domains/todo' }
domain_users = { path = 'libs/domains/users' }
domain_vector = { path = 'libs/domains/vector' }
email = { path = 'libs/notifications/email' }
eyre = { version = '0.6.14', features = ['default'] }
feature_flags = { path = 'libs/core/feature-flags' }
field-selector = { path = 'libs/core/field-selector' }
futures = '0.3.34'
globset = '0.4.20'
grpc-client = { path = 'libs/core/grpc' }
handlebars = '6.4.4'
http-body-util = '0.1.5'
jsonwebtoken = { version = '11.0.0', features = ['aws_lc_rs'] }
k8s-openapi = { version = '0.28.0', features = ['v1_33'] }
kube = { version = '4.2.0', features = ['client', 'runtime', 'derive'] }
lettre = { version = '0.11.23', default-features = false, features = ['tokio1-rustls-tls', 'builder', 'smtp-transport', 'hostname'] }
messaging = { path = 'libs/core/messaging' }
metrics = '0.24.6'
metrics-exporter-prometheus = '0.18.3'
mockall = '0.15.0'
napi = { version = '3.12.2', default-features = false, features = ['napi4', 'serde-json'] }
napi-build = '2.4.1'
napi-derive = '3.6.3'
oauth2 = { version = '5.0.0', default-features = false }
oidc-auth = { path = 'libs/core/oidc-auth', version = '0.1.0' }
opentelemetry = '0.32.0'
opentelemetry-otlp = { version = '0.32.0', features = ['grpc-tonic', 'trace'], default-features = false }
opentelemetry-semantic-conventions = '0.32.1'
opentelemetry_sdk = { version = '0.32.1', features = ['rt-tokio', 'trace'] }
parking_lot = '0.12.5'
pluralizer = '0.5.0'
proc-macro2 = '1.0.107'
prost = '0.14.4'
qdrant-client = '1.19.0'
quote = '1.0.47'
rand = '0.10.2'
redis = { version = '1.6.0', features = ['aio', 'r2d2', 'tokio-comp', 'connection-manager'] }
regex = '1.13.1'
reqwest = { version = '0.13.4', features = ['json', 'rustls'], default-features = false }
rpc = { path = 'libs/rpc' }
rustls = { version = '0.23.43', default-features = false, features = ['aws-lc-rs', 'std'] }
sea-orm = { version = '2.0.2', features = ['sqlx-postgres', 'runtime-tokio-rustls', 'macros', 'with-uuid', 'with-chrono', 'mock', 'debug-print', 'with-json'] }
sea-orm-migration = { version = '2.0.2', features = ['sqlx-postgres', 'runtime-tokio-rustls'] }
sea_orm_resource = { path = 'libs/core/proc_macros/sea_orm_resource', version = '0.1.0' }
selectable_fields = { path = 'libs/core/proc_macros/selectable_fields', version = '0.1.0' }
serde = { version = '1.0.229', features = ['derive'] }
serde_json = { version = '1.0.151' }
serde_yaml_ng = { version = '0.10.0' }
sha2 = '0.11.0'
sqlx = { version = '0.9.0', default-features = false, features = ['postgres', 'macros', 'uuid', 'chrono', 'migrate'] }
strum = { version = '0.28.0', features = ['derive'] }
syn = { version = '3.0.4', features = ['full', 'extra-traits', 'visit'] }
temp-env = '0.3'
temporalio-client = '0.8.0'
temporalio-common = '0.8.0'
temporalio-macros = '0.8.0'
temporalio-sdk = '0.8.0'
temporalio-workflow = '0.8.0'
test-utils = { path = 'libs/testing/test-utils' }
testcontainers = '=0.27'
testcontainers-modules = '0.15.0'
thiserror = '2.0.20'
tokio = { version = '1.53.1', features = ['full'] }
tokio-stream = { version = '0.1.19', features = ['sync'] }
tokio-test = '0.4'
toml = { version = '1.1.4', default-features = false, features = ['parse', 'serde'] }
tonic = { version = '0.14.6', features = ['zstd'] }
tonic-health = '0.14.6'
tonic-prost = '0.14.6'
tower = '0.5.3'
tower-http = { version = '0.7.1', features = ['timeout', 'trace', 'compression-full', 'decompression-full', 'cors'] }
tracing = '0.1.44'
tracing-error = '0.2.1'
tracing-opentelemetry = '0.33.0'
tracing-subscriber = { version = '0.3.23', features = ['env-filter', 'json', 'serde_json'] }
trybuild = '1.0.120'
ts-rs = { version = '12.0.1', features = ['chrono-impl', 'uuid-impl'] }
utoipa = { version = '5.5.0', features = ['axum_extras', 'chrono', 'uuid'] }
utoipa-rapidoc = { version = '6.0.0', features = ['axum'] }
utoipa-redoc = { version = '6.0.0', features = ['axum'] }
utoipa-scalar = { version = '0.3.0', features = ['axum'] }
utoipa-swagger-ui = { version = '9.0.2', features = ['axum'] }
uuid = { version = '1.26.0', features = ['serde', 'v4', 'v7'] }
validator = { version = '0.21.0', features = ['derive'] }

[workspace.package]
version = '0.1.0'
edition = '2024'
license = 'MIT OR Apache-2.0'
repository = 'https://github.com/yurikrupnik-org/nx-playground'

[workspace.lints.rust]
unsafe_code = 'warn'

[workspace.lints.clippy]
unwrap_used = 'warn'
dbg_macro = 'warn'
todo = 'warn'
manual_let_else = 'warn'
uninlined_format_args = 'warn'

[profile.dev]
incremental = true
codegen-units = 16 # Parallel compilation
opt-level = 0 # No optimization for speed
debug = 'line-tables-only'

[profile.release]
opt-level = 'z'
codegen-units = 1
strip = true
lto = true
panic = 'abort'
incremental = false # Explicit: LTO doesn't benefit from incremental

[profile.napi]
inherits = 'release'
opt-level = 3
panic = 'unwind'
lto = 'thin'
strip = true
codegen-units = 16 # addons are small; parallel codegen keeps rebuilds quick
