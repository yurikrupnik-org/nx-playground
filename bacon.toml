# Bacon configuration for multiple apps
default_job = "check"

[jobs.lint]
command = ["nx", "run-many", "-t", "lint", "--parallel=16"]
need_stdout = true

[jobs.check]
command = ["cargo", "check", "--color", "always"]
need_stdout = false

[jobs.todo-api]
command = ["cargo", "run", "-p", "todo_api", "--color", "always"]
need_stdout = true
watch = ["apps/todo/api", "libs"]
allow_warnings = true
background = false
on_change_strategy = "kill_then_restart"
env = { DATABASE_URL = "postgres://myuser:mypassword@localhost:5432/todo" }

[jobs.todo-worker]
command = ["cargo", "run", "-p", "todo_worker", "--color", "always"]
need_stdout = true
watch = ["apps/todo/worker", "libs"]
allow_warnings = true
background = false
on_change_strategy = "kill_then_restart"
env = { DATABASE_URL = "postgres://myuser:mypassword@localhost:5432/todo" }

[jobs.todo-web]
command = ["bun", "nx", "dev", "todo-web"]
need_stdout = true
# vite owns hot-reload; do NOT let bacon watch/restart it (that would kill HMR).
default_watch = false
background = false

[jobs.zerg-api]
command = ["cargo", "run", "-p", "zerg_api", "--color", "always"]
need_stdout = true
watch = ["apps/zerg/api", "libs"]
allow_warnings = true
background = false
on_change_strategy = "kill_then_restart"

[jobs.zerg-email-nats]
command = ["cargo", "run", "-p", "zerg_email_nats", "--color", "always"]
need_stdout = true
watch = ["apps/zerg/email-nats", "libs"]
allow_warnings = true
background = false
on_change_strategy = "kill_then_restart"

[jobs.zerg-email]
command = ["cargo", "run", "-p", "zerg_tasks", "--color", "always"]
need_stdout = true
watch = ["apps/zerg/email", "libs"]
allow_warnings = true
background = false
on_change_strategy = "kill_then_restart"
env = { PORT = "7777" }

[jobs.terran-api]
command = ["cargo", "run", "-p", "terran_api", "--color", "always"]
need_stdout = true
watch = ["apps/terran/api", "libs"]
allow_warnings = true
background = false
on_change_strategy = "kill_then_restart"

[jobs.zerg-tasks]
command = ["cargo", "run", "-p", "zerg_tasks", "--color", "always"]
need_stdout = true
watch = ["apps/zerg/tasks", "libs"]
allow_warnings = true
background = false
on_change_strategy = "kill_then_restart"
#env = { DATABASE_URL = "postgres://myuser:mypassword@localhost:5432/mydatabase" }


[jobs.zerg-cli]
command = ["cargo", "run", "-p", "zerg_cli", "--color", "always"]
need_stdout = true

[jobs.zerg-operator]
command = ["cargo", "run", "-p", "zerg_operator", "--color", "always"]
need_stdout = true

# Watch all workspace members
[jobs.check-all]
command = ["cargo", "check", "--workspace", "--color", "always"]
need_stdout = false

[jobs.test-all]
command = ["cargo", "test", "--workspace", "--color", "always"]
need_stdout = true

[jobs.test-all-fast]
command = ["cargo", "test", "--workspace", "--color", "always"]
need_stdout = true
