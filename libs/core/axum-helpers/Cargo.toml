[package]
name = "axum-helpers"
description = "Axum service building blocks: server lifecycle with graceful shutdown, health checks, structured errors, validated extractors, security middleware, rate limiting, and Prometheus metrics"
license.workspace = true
repository.workspace = true
version.workspace = true
edition.workspace = true

[dependencies]
async-trait.workspace = true
axum.workspace = true
chrono.workspace = true

# Internal dependencies
core_config = { workspace = true }

eyre.workspace = true
futures.workspace = true

# Prometheus metrics (RED middleware + /metrics endpoint)
metrics.workspace = true
metrics-exporter-prometheus.workspace = true

# Auth identity for user-keyed rate limiting (inserted by oidc_auth::auth_required)
oidc-auth = { workspace = true }

# Redis - no longer optional, required for auth
redis = { workspace = true }

# Database dependencies - required for error handling
sea-orm = { workspace = true }
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true

# OpenAPI/Swagger dependencies
utoipa.workspace = true
utoipa-rapidoc.workspace = true
utoipa-redoc.workspace = true
utoipa-scalar.workspace = true
utoipa-swagger-ui.workspace = true
uuid.workspace = true
validator.workspace = true
anyhow = "1.0.104"

[dev-dependencies]
# HTTP client for examples/http_service.rs, which exercises the router over a
# real socket. tests/examples_it.rs runs that example as a process.
reqwest = { workspace = true }
temp-env = "0.3"
test-utils = { workspace = true, features = ["redis"] }
tokio-test = "0.4"
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
