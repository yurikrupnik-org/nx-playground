[package]
name = "feature_flags"
description = "Async Flagsmith feature-flag client with per-identity evaluation, TTL caching, and hardcoded fallbacks"
license.workspace = true
repository.workspace = true
version.workspace = true
edition.workspace = true

[dependencies]
core_config = { workspace = true }
parking_lot = { workspace = true }
# `query` (off in the workspace default set) builds `?identifier=…` for the
# Flagsmith identity endpoint with correct percent-encoding.
reqwest = { workspace = true, features = ["query"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
temp-env = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
