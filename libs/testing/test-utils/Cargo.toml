[package]
name = "test-utils"
publish = false
version.workspace = true
edition.workspace = true

[features]
default = ["postgres"]
postgres = ["dep:sea-orm"]
redis = ["dep:redis"]
nats = ["dep:async-nats", "dep:futures"]
# Invariant checks for the committed `docs/openapi/*.json` artifacts. Pure
# serde_json, no containers: pair it with `default-features = false`.
openapi = ["dep:serde_json"]
all = ["postgres", "redis", "nats", "openapi"]

[dependencies]
# NATS dependencies (optional)
async-nats = { workspace = true, optional = true }
futures = { workspace = true, optional = true }

# Redis dependencies (optional)
redis = { workspace = true, optional = true }

# Postgres dependencies (optional, enabled by default)
# Note: Uses SQL migrations from manifests/db/zerg/migrations/
sea-orm = { workspace = true, optional = true }

# OpenAPI document walker (optional, feature "openapi")
serde_json = { workspace = true, optional = true }

# Testcontainers (always available)
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true, features = ["postgres", "redis", "nats"] }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
