# Root config for the `butler` CLI — everything repo-wide, and nothing app-local.
#
# THREE consumers read these files, so every fact lives in exactly one of them:
#   butler            renders Tiltfiles and, with the `app` KCL package, the
#                     k8s manifests under [k8s] outDir (manifests/k8s/{env}/)
#   tools/nx/*.ts     infers each app's nx `container`/`scan` target (butler's
#                     Rust port of it infers the same graph natively)
#   the KCL package   validates the workload payload against its typed schema
#
# Two levels, one fact per place:
#   butler.toml              this file: registry, environment, infra resources,
#                            image conventions, per-Dockerfile defaults, and the
#                            per-kind workload shape every app inherits
#   <app>/butler.toml        one per app: its `[workload]` (what differs from the
#                            kind default), its dev-loop facts (`[tilt]`), and an
#                            `[image]` only when it departs from the convention
#
# `task graph-check` and `task k8s-check` fail if an inferred target or a
# generated artifact stops matching these files.
#
# A single-app repo uses this file alone: add an `[app]` section describing the
# app that lives at the repo root (see docs/tilt-generators.md).

# Image-name prefix. Substituted for `$REGISTRY` in any image reference,
# including the inferred `container` target `tags` that CI builds.
registry = "yurikrupnik"

# Deployment environment: kustomize overlay directory and KCL `-D env=` value.
env = "dev"

# The KCL package that turns a `[workload]` payload into Kubernetes objects.
# Pinned: an unpinned OCI reference makes every render depend on whatever was
# published last. Source: ~/gitorgs/kcl-packages/packages/app.
# `imageTag` is the tag butler writes into the rendered manifests per env; an env
# not listed here uses its own name (so `dev` renders `:dev`).
[k8s]
package = "oci://docker.io/yurikrupnik/app"
tag = "0.1.2"
outDir = "manifests/k8s/{env}"
# Where the rendered manifests and their aggregate land. `{env}` expands to `env`
# above, so a repo that renders several environments keeps them apart with one
# line (`outDir = "manifests/gitops/{env}/apps"`). Both butler and
# tools/nx/k8s-targets.ts read this key — nx caches on declared outputs, so they
# must agree on the path.

# Appended verbatim to the generated aggregate kustomization, and resolved
# RELATIVE TO outDir — change one and check the other. Environment fixtures only:
# objects that are not workload shape and that the package does not render (it
# emits ExternalSecrets, not literal Secrets). They live outside every
# `manifests/k8s/{env}` so the generated aggregate never overwrites their
# kustomization.
extraResources = ["../fixtures/dev"]

[k8s.imageTag]
dev = "dev"
prod = "main"

# Git submodules (`butler submodule`, docs/tilt-generators.md). Every submodule in
# .gitmodules gets a Flux GitRepository pinned to the commit the index records,
# written to `outDir` with its own aggregate kustomization. `outDir` is owned by
# `butler submodule gen` (stale generated files are deleted), so it must differ
# from `[k8s] outDir`.
[submodules]
outDir = "manifests/k8s/submodules"

# Per submodule, keyed like .gitmodules: `kustomize` adds a Flux Kustomization
# over the submodule's own manifests; a `[submodule.<name>.workload]` would
# instead render it through the `app` package like any app here — not both.
# first-rust-app ships its own kustomize base, so Flux applies that.
[submodule.first-rust-app]
kustomize = "k8s/base"

# Web UIs of the dev loop (`butler ui`, docs/tilt-generators.md): one
# `[ui.<name>]` per UI, its `url` carrying the port. `butler ui serve` frames
# them all in one page next to the ports in use; `butler ui add/set/remove`
# edit the tables below and keep the rest of this file as written.
[ui]

[ui.flux]
url = "http://localhost:9080/"

[ui.alerts]
url = "http://localhost:55505/#/alerts"

[ui.grafana]
url = "http://localhost:55558/login"

[ui.prometheus]
url = "http://localhost:55798/query"

# Apps that ship an image but no workload of their own: nothing in this repo
# deploys them, but CI still builds and scans the image. Every other app earns
# its nx `container`/`scan` targets by declaring a `[workload]` (see
# tools/nx/container-targets.ts).
[container]
extra = ["apps/zerg/vector"]

# Project-graph inference. Unset `infer` = butler's native Rust port of
# tools/nx/plugin.ts; `infer = ["bun", "tools/nx/infer.ts"]` runs the
# TypeScript plugin itself instead. `butler graph verify` (task graph-check)
# diffs butler's graph against `nx graph --file` and skips only the targets
# below.
#
# `nx-release-publish`: the publish step of `nx release`, which stays nx's job —
# butler neither releases nor runs these executors. Two sources add it, neither
# of them this repo's plugin: nx's own package.json layer (`@nx/js:release-publish`
# on every package.json not marked `"private": true`, once @nx/js is installed)
# and @monodon/rust (`@monodon/rust:release-publish` on every crate whose
# `publish` is not `false`). Everything ELSE those plugins contribute is compared:
# @monodon/rust's crate names and cargo-metadata edges equal the repo plugin's
# (no `[target.*]` dependency tables or `package =` renames in this repo), and
# @nx-tools/nx-container adds `container` only to a directory holding both a
# `Dockerfile` and a project/package.json — none exists (the one file named
# `Dockerfile` is manifests/dockers/Dockerfile). If either stops holding, verify
# reports it.
[graph]
verifyIgnoreTargets = ["nx-release-publish"]

# Build stage for an image that pins none itself. NOT Tilt-only: the stage
# reaches CI too, through the `target` option of the inferred nx `container`
# target, because a wrong stage is a silent production defect —
# manifests/dockers/Dockerfile ends on static-web-server, which serves the SPA
# but drops the `/api` reverse proxy every web Deployment configures through its
# proxy-envs ConfigMap. Only the nginx stage honours those env vars.
[dockerfileTarget]
"manifests/dockers/rust.Dockerfile" = "rust"
"manifests/dockers/Dockerfile" = "nginx"
"manifests/dockers/node.Dockerfile" = "runtime"

# How to build an app that declares nothing — this repo's convention, stated
# once, and the source of both its Tiltfile `docker_build` and its nx
# `container` target. An app needing something else declares `[image]` in its
# own butler.toml. buildArg names the single per-app argument: the crate name
# for a service, `<app>/dist` for a web app.
[imageDefaults.service]
dockerfile = "manifests/dockers/rust.Dockerfile"
target = "rust"
buildArg = "APP_NAME"

[imageDefaults.web]
dockerfile = "manifests/dockers/Dockerfile"
target = "nginx"
buildArg = "DIST_PATH"

# Astro SSR: a Node process, not a static file server. buildArg is the app dir
# itself because the image installs and builds the app internally — its N-API
# addon (`@native/field-selector`) must be compiled for the image's platform, so
# a locally built `dist/` cannot be copied in.
[imageDefaults.node]
dockerfile = "manifests/dockers/node.Dockerfile"
target = "runtime"
buildArg = "APP_DIR"

# The workload shape every app of a kind inherits — stated once here so an app's
# own `[workload]` carries only what DIFFERS. These tables are pass-through: the
# keys are the `app` package's `Workload` schema, butler serialises them to the
# values file unchanged, and KCL is what validates them. Merge order, deep and
# right-wins: workloadDefaults.<kind> < <app> [workload] < [env.<env>.workload].
#
# `replicas` is pinned because the package defaults it to 0 (a zero-replica
# Deployment); `partOf`/`namespace`/`name`/`image` are never written here or in
# an app file — butler injects them from the app path and the image facts above,
# which is what keeps the image reference single-homed.
# runAsUser/runAsGroup 65532 is the rust image's own `USER`, not a preference:
# rust.Dockerfile's runtime stage carried three stacked USER lines (65534, 10001,
# 65532) of which only the last applied, so the 65534 the old manifests pinned
# matched a dead line. `prometheus = false` because no service in this repo
# serves /metrics yet — an app that grows one opts in with `prometheus = true`
# rather than every other app carrying a scrape annotation pointing at a 404.
[workloadDefaults.service]
component = "api-server"
replicas = 1
port = 8080
runAsUser = 65532
runAsGroup = 65532
prometheus = false
terminationGracePeriodSeconds = 30

[workloadDefaults.service.resources]
requests = { memory = "128Mi", cpu = "250m" }
limits = { memory = "512Mi" }

# Static SPA behind nginx: no metrics endpoint, unprivileged nginx uid, and the
# writable dirs nginx needs on a read-only root filesystem.
[workloadDefaults.web]
component = "frontend"
replicas = 1
port = 8080
runAsUser = 101
runAsGroup = 101
prometheus = false
terminationGracePeriodSeconds = 10

[workloadDefaults.web.resources]
requests = { memory = "32Mi", cpu = "50m" }
limits = { memory = "64Mi", cpu = "100m" }

# nginx on a read-only root filesystem needs these four writable dirs. They are
# a property of the image, identical for every SPA, so no app repeats them.
[[workloadDefaults.web.volumeMounts]]
name = "nginx-conf-d"
mountPath = "/etc/nginx/conf.d"

[[workloadDefaults.web.volumeMounts]]
name = "nginx-cache"
mountPath = "/var/cache/nginx"

[[workloadDefaults.web.volumeMounts]]
name = "nginx-run"
mountPath = "/var/run"

[[workloadDefaults.web.volumeMounts]]
name = "tmp"
mountPath = "/tmp"

[[workloadDefaults.web.volumes]]
name = "nginx-conf-d"
emptyDir = {}

[[workloadDefaults.web.volumes]]
name = "nginx-cache"
emptyDir = {}

[[workloadDefaults.web.volumes]]
name = "nginx-run"
emptyDir = {}

[[workloadDefaults.web.volumes]]
name = "tmp"
emptyDir = {}

# Node SSR: heavier than a file server (V8 heap), runs as the node base image's
# `node` user, and needs only /tmp writable.
[workloadDefaults.node]
component = "frontend"
replicas = 1
port = 8080
runAsUser = 1000
runAsGroup = 1000
prometheus = false
terminationGracePeriodSeconds = 30

[workloadDefaults.node.resources]
requests = { memory = "192Mi", cpu = "100m" }
limits = { memory = "512Mi", cpu = "1000m" }

[tilt]
# Churn that must never enter a rust or node image context. The `only=` allow
# list is derived per app from the project graph, so this list only has to cover
# files that live *inside* whitelisted directories.
#
# Markdown is deliberately absent: crate READMEs are compile inputs
# (`#![doc = include_str!("../README.md")]`), so the repo-wide `.dockerignore`
# excludes `**/*.md` and then re-includes `!**/README.md`. Tilt stores every
# ignore entry as its own unit and cannot express that negation
# (tilt-dev/tilt#3070), so md filtering lives only in `.dockerignore`, which
# Tilt also applies to this context.
contextIgnore = [
    "target/",
    "**/.git/",
    "**/k8s/",
    "**/Tiltfile",
    "apps/**/node_modules/",
    "**/dist/",
]

# Context paths a Dockerfile COPYs that belong to no app. Tilt-only: `only=` is
# a per-app allow list, which buildx cannot express (CI narrows its context with
# the repo-wide .dockerignore instead).
[tilt.dockerfileOnly]
"manifests/dockers/Dockerfile" = ["manifests/dockers/default.conf.template"]

# Infra services reached through kubectl port-forward.
[[tilt.portForward]]
name = "postgres"
command = "kubectl port-forward -n dbs deployment/postgres 5432:5432"
probePort = 5432

[[tilt.portForward]]
name = "redis"
command = "kubectl port-forward -n dbs deployment/redis 6379:6379"
probePort = 6379

[[tilt.portForward]]
name = "mailhog"
command = "kubectl port-forward -n dbs deployment/mailhog 8025:8025"
probePort = 8025

# Monitoring stack (`task observability-up`, scripts/tasks/observability.yml);
# local ports are the ones `[ui.grafana]` / `[ui.prometheus]` above point at.
[[tilt.portForward]]
name = "grafana"
command = "kubectl port-forward -n monitoring deployment/grafana 55558:3000"
probePort = 55558

[[tilt.portForward]]
name = "prometheus"
command = "kubectl port-forward -n monitoring deployment/prometheus-server 55798:9090"
probePort = 55798

# Cluster resources owned by no single app; apps reference them by name in their
# own butler.toml `resourceDeps`.
[[tilt.sharedResource]]
name = "zerg-shared-config"
kustomize = "apps/zerg/shared/k8s/kustomize/overlays/dev"
objects = ["zerg-shared-config:configmap", "zerg-shared-secrets:secret"]

# Tekton (`butler tekton gen`, docs/tilt-generators.md): the runner Tasks plus
# one Pipeline per runnable target, written to `outDir` (owned outright, like
# `[submodules] outDir`). The targets are derived — every nx project:target,
# Taskfile task (root file + local includes; remote includes are skipped),
# public justfile recipe, `.nu` script with a `main`, and one build-and-deploy
# Pipeline per app with a `[workload]` (Tilt's dev loop, in-cluster: buildkit
# builds the image the Tiltfile builds, then the manifest `butler k8s gen`
# rendered is applied with that image pinned by digest). This table holds only
# what cannot be derived. Apply with `kubectl apply -k manifests/tekton -n <ns>`;
# the ServiceAccount a deploy PipelineRun uses needs apply rights in the apps'
# namespaces.
[tekton]
outDir = "manifests/tekton"
repository = "https://github.com/yurikrupnik-org/nx-playground.git"
revision = "main"
# The task and nu runners download their binary (checked against the release's
# own checksum list) into the toolchain image below: go-task ships no
# maintained image, and the nushell image carries no git, which scripts call.
taskVersion = "3.53.1"
nuVersion = "0.116.0"

# Target ids: nx:<project>:<target>, task:<name>, just:<recipe>, nu:<path>,
# deploy:<app>. Excluded here: what never terminates, needs a TTY, or acts on
# the developer's machine rather than a checkout (local kind/compose/zellij,
# `cargo install`, opening a browser). A glob matching nothing is an error.
exclude = [
    # dev servers, bacon/mprocs loops, `cargo run` of long-running services
    "nx:*:serve",
    "nx:*:dev",
    "nx:*:run",
    "nx:*:e2e:ui",
    # uv dependency edits: need a package argument and rewrite the lockfile
    "nx:*:add",
    "nx:*:remove",
    "nx:*:update",
    # installs the butler binary onto the host
    "nx:butler:install",
    "task:dev",
    "task:dev-*",
    "task:run",
    "task:web",
    "task:events",
    "task:cnpg-logs",
    "task:self-update",
    # host-local: devkit/compose/kind/zellij lifecycle, secrets onto disk,
    # installs, browsers, scaffolding
    "task:local-*",
    "task:docker-*",
    "task:reset-db",
    "task:kube-*",
    "task:observability-*",
    # insights: `gh auth token` + port-forwards from the developer's host
    "task:insights-*",
    "task:lol",
    "task:z",
    "task:zj",
    "task:zj-kill",
    "task:generate-env",
    "task:slava",
    "task:docs-open",
    "task:flags-open",
    "task:create-nx-project",
]

# Step image per runner, required only once a Pipeline uses it (no justfile
# here, so no `just` image). `nx`, `task` and `nu` name the toolchain the
# targets shell out to: bun covers the JS side, alpine/git the nu scripts; a
# target that needs cargo, kubectl, kcl, ... needs an image carrying it here.
[tekton.images]
git = "alpine/git:2.54.0"
fetch = "alpine:3.24.2"
nx = "oven/bun:1.4.2"
task = "oven/bun:1.4.2"
nu = "alpine/git:2.54.0"
buildkit = "moby/buildkit:v0.33.0-rootless"
kubectl = "alpine/k8s:1.35.9"

# Every Taskfile target runs as `taskgraph shim <task>` (docs/ci-insights.md):
# go-task still runs it, and taskgraph publishes each execution to the NATS
# `TASKGRAPH` stream with the PipelineRun, TaskRun and cloned commit as its CI
# origin — the in-cluster twin of .github/actions/taskgraph. `release` is the
# rolling `taskgraph-cli-latest` release (.github/workflows/taskgraph-cli.yml),
# fetched with its .sha256 when a TaskRun starts; a download, checksum or
# probe failure runs the task on plain go-task instead of failing it.
[tekton.taskgraph]
release = "https://github.com/yurikrupnik-org/nx-playground/releases/download/taskgraph-cli-latest"
natsUrl = "nats://nats.dbs.svc.cluster.local:4222"
