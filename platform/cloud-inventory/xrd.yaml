# CloudInventory API — the platform's "observe these cloud resources" contract.
# Read-only by construction: every composed resource is created with
# managementPolicies: ["Observe"], so Crossplane never creates, updates or
# deletes anything in the target. It only reflects what already exists.
#
# Claim (namespaced): CloudInventory · Composite (cluster): XCloudInventory
#
# The target shape is provider-agnostic: v1alpha1 ships `cluster` (in-cluster
# k8s via provider-kubernetes). A future GCP composition adds a sibling `gcp`
# key to the same version — no breaking schema change for existing claims.
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xcloudinventories.platform.playground.io
spec:
  group: platform.playground.io
  names:
    kind: XCloudInventory
    plural: xcloudinventories
  claimNames:
    kind: CloudInventory
    plural: cloudinventories
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                parameters:
                  type: object
                  properties:
                    targets:
                      type: array
                      minItems: 1
                      items:
                        type: object
                        properties:
                          # Per-target composition-resource-name; must be unique
                          # within a claim and DNS-label safe (used in the
                          # composed Object's name).
                          name:
                            type: string
                            pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                            maxLength: 40
                          # Mirrors ResourceType in libs/domains/cloud_resources
                          # (serde lowercase) — the API maps it 1:1.
                          resourceType:
                            type: string
                            enum:
                              - compute
                              - storage
                              - database
                              - network
                              - serverless
                              - analytics
                              - other
                            default: other
                          cluster:
                            type: object
                            properties:
                              apiVersion: { type: string }
                              kind: { type: string }
                              name: { type: string }
                              # Omit for cluster-scoped resources.
                              namespace: { type: string }
                            required:
                              - apiVersion
                              - kind
                              - name
                        required:
                          - name
                          - cluster
                  required:
                    - targets
              required:
                - parameters
            status:
              type: object
              properties:
                inventory:
                  type: object
                  properties:
                    observed: { type: integer }
                    resources:
                      type: array
                      items:
                        type: object
                        properties:
                          name: { type: string }
                          kind: { type: string }
                          namespace: { type: string }
                          resourceType: { type: string }
