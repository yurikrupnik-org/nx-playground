# Composition: DevEnvironment on a local kind cluster.
# Logic lives in KCL (function-kcl) — "composition as a real language" today.
# Roadmap: WASM function runtimes (SpinKube-style) once the Crossplane function
# WASM story is production-ready; the KCL below is the portable seam.
#
# Three integration styles, deliberately:
#   postgres → CNPG operator CR      (CNCF operator, via provider-kubernetes Object)
#   nats     → official helm chart   (CNCF project, via provider-helm Release)
#   redis    → plain Deployment/Svc  (no blessed operator; raw Objects)
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: devenvironment-kind
  labels:
    target: kind
spec:
  compositeTypeRef:
    apiVersion: platform.playground.io/v1alpha1
    kind: XDevEnvironment
  mode: Pipeline
  pipeline:
    - step: compose
      functionRef:
        name: function-kcl
      input:
        apiVersion: krm.kcl.dev/v1alpha1
        kind: KCLInput
        spec:
          source: |
            oxr = option("params").oxr
            params = oxr.spec?.parameters or {}
            pg = params?.postgres or {}
            redis = params?.redis or {}
            nats = params?.nats or {}

            claim = oxr.spec?.claimRef?.name or oxr.metadata.name
            ns = "devenv-" + claim

            _obj = lambda name: str, manifest -> any {
                {
                    apiVersion = "kubernetes.crossplane.io/v1alpha2"
                    kind = "Object"
                    metadata.name = "{}-{}".format(claim, name)
                    metadata.annotations = {"krm.kcl.dev/composition-resource-name" = name}
                    spec = {
                        forProvider.manifest = manifest
                        providerConfigRef.name = "in-cluster"
                    }
                }
            }

            _namespace = _obj("namespace", {
                apiVersion = "v1"
                kind = "Namespace"
                metadata.name = ns
            })

            _postgres = [_obj("postgres", {
                apiVersion = "postgresql.cnpg.io/v1"
                kind = "Cluster"
                metadata = {name = claim + "-pg", namespace = ns}
                spec = {
                    instances = pg?.instances or 1
                    storage.size = "{}Gi".format(pg?.storageGB or 1)
                }
            })] if pg?.enabled != False else []

            _redis = [
                _obj("redis-deploy", {
                    apiVersion = "apps/v1"
                    kind = "Deployment"
                    metadata = {name = "redis", namespace = ns}
                    spec = {
                        replicas = 1
                        selector.matchLabels = {app = "redis"}
                        template = {
                            metadata.labels = {app = "redis"}
                            spec.containers = [{
                                name = "redis"
                                image = "redis:7-alpine"
                                ports = [{containerPort = 6379}]
                            }]
                        }
                    }
                })
                _obj("redis-svc", {
                    apiVersion = "v1"
                    kind = "Service"
                    metadata = {name = "redis", namespace = ns}
                    spec = {
                        selector = {app = "redis"}
                        ports = [{port = 6379, targetPort = 6379}]
                    }
                })
            ] if redis?.enabled != False else []

            _nats = [{
                apiVersion = "helm.crossplane.io/v1beta1"
                kind = "Release"
                metadata.name = claim + "-nats"
                metadata.annotations = {"krm.kcl.dev/composition-resource-name" = "nats"}
                spec = {
                    forProvider = {
                        chart = {
                            name = "nats"
                            repository = "https://nats-io.github.io/k8s/helm/charts/"
                            version = "1.3.14"
                        }
                        namespace = ns
                        values = {
                            fullnameOverride = "nats"
                            config.jetstream.enabled = nats?.jetstream != False
                        }
                    }
                    providerConfigRef.name = "in-cluster"
                }
            }] if nats?.enabled != False else []

            _status = {
                apiVersion = oxr.apiVersion
                kind = oxr.kind
                status.environment = {
                    namespace = ns
                    if pg?.enabled != False:
                        postgresSecret = claim + "-pg-app"
                    if redis?.enabled != False:
                        redisHost = "redis.{}.svc.cluster.local:6379".format(ns)
                    if nats?.enabled != False:
                        natsUrl = "nats://nats.{}.svc.cluster.local:4222".format(ns)
                }
            }

            items = [_namespace] + _postgres + _redis + _nats + [_status]
    - step: ready
      functionRef:
        name: function-auto-ready
