# yaml-language-server: $schema=https://taskfile.dev/schema.json
# =============================================================================
# Database Management (multi-DB)
# =============================================================================
# Layout: manifests/db/<db>/{schema.sql, seed.sql, migrations/ (optional), k8s/}
# Source of truth: schema.sql per DB
#
# Each DB picks one of two modes:
#
# A) Declarative (no migrations/ dir) — e.g. zerg
#   1. Edit manifests/db/<db>/schema.sql
#   2. task db-fresh DB=<db>                  → drop/recreate locally from schema + seed
#   3. task gen-schema-configmap DB=<db>      → regenerate cluster ConfigMap (AtlasSchema)
#
# B) Versioned (has migrations/) — e.g. terran
#   1. Edit manifests/db/<db>/schema.sql (source of truth)
#   2. task migrate-add DB=<db> NAME=<name>   → creates .up.sql
#   3. Write ALTER/CREATE in .up.sql
#   4. task migrate DB=<db>                   → apply locally
#   5. task migrate-validate DB=<db>          → verify schema.sql == migrations result
#   6. task gen-migrations-configmap DB=<db>  → regenerate cluster ConfigMap (AtlasMigration)
#
# The migrate* tasks apply to mode B only; they fail on a declarative DB by design.
#
# Local: docker-compose postgres on :5432 with super-user `myuser`.
# Cluster: kind/CNPG via port-forward on :5433.
version: '3'

# =============================================================================
# Helpers
# =============================================================================
# Both are shell snippets spliced into task scripts and evaluated at run time
# (not at Taskfile load), so `task --list` / `--dry` never touch docker.
vars:
  # Run psql via docker-compose or kubectl (whichever is available).
  # Usage inside a script: PG=$({{.PG_CMD}})
  PG_CMD: "if docker exec dockers-postgres-1 true 2>/dev/null; then echo 'docker exec -i dockers-postgres-1 psql -U myuser'; else echo 'kubectl exec -i -n dbs deployment/postgres -- psql -U myuser'; fi"
  # Per-DB connection URL. Add new (db, env) pairs as you onboard databases.
  # env is one of: local, cluster
  # Defines the shell function `db_url <db> <env>`; splice {{.DB_URL_FN}} into a
  # script, then use "$(db_url <db> local)".
  DB_URL_FN: |
    db_url() {
      case "$1-$2" in
        zerg-local)    echo "postgres://myuser:mypassword@localhost:5432/zerg?sslmode=disable" ;;
        zerg-cluster)  echo "postgres://zerg:zerg@localhost:5433/zerg?sslmode=disable" ;;
        tasks-local)     echo "postgres://myuser:mypassword@localhost:5432/tasks?sslmode=disable" ;;
        tasks-cluster)   echo "postgres://tasks:tasks@localhost:5433/tasks?sslmode=disable" ;;
        terran-local)    echo "postgres://myuser:mypassword@localhost:5432/terran?sslmode=disable" ;;
        terran-cluster)  echo "postgres://terran:terran@localhost:5433/terran?sslmode=disable" ;;
        todo-local)      echo "postgres://myuser:mypassword@localhost:5432/todo?sslmode=disable" ;;
        todo-cluster)    echo "postgres://todo:todo@localhost:5433/todo?sslmode=disable" ;;
        *)
          echo "unknown db/env: $1/$2 — add it to DB_URL_FN in scripts/tasks/db.yml" >&2
          return 1
          ;;
      esac
    }

tasks:
  # ===========================================================================
  # Discovery
  # ===========================================================================

  db-list:
    desc: List all configured databases (folders under manifests/db/)
    cmds:
      - cmd: ls -d manifests/db/*/ 2>/dev/null | xargs -n1 basename
        silent: true

  # ===========================================================================
  # Local Development
  # ===========================================================================

  db-fresh:
    desc: Reset <db> from schema.sql + seed.sql (local docker-compose)
    requires: { vars: [DB] }
    cmds:
      - |
        set -euo pipefail
        PG=$({{.PG_CMD}})
        echo "Terminating existing connections to {{.DB}}..."
        $PG -d postgres -c \
          "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = '{{.DB}}' AND pid <> pg_backend_pid();" > /dev/null 2>&1 || true
        echo "Resetting {{.DB}}..."
        $PG -d postgres -c "DROP DATABASE IF EXISTS {{.DB}};"
        $PG -d postgres -c "CREATE DATABASE {{.DB}};"
        if [ -f manifests/db/{{.DB}}/schema.sql ]; then
          echo "Applying schema..."
          $PG -d {{.DB}} < manifests/db/{{.DB}}/schema.sql
        elif [ -d manifests/db/{{.DB}}/migrations ]; then
          echo "No schema.sql; applying migrations..."
          for f in manifests/db/{{.DB}}/migrations/*.sql; do
            [ -f "$f" ] || continue
            case "$f" in *.down.sql) continue ;; esac
            echo "  applying $(basename "$f")"
            $PG -d {{.DB}} < "$f"
          done
        fi
        if [ -f manifests/db/{{.DB}}/roles.sql ]; then
          echo "Applying roles + grants..."
          $PG -d {{.DB}} < manifests/db/{{.DB}}/roles.sql
        fi
        if [ -f manifests/db/{{.DB}}/seed.sql ]; then
          echo "Applying seed data..."
          $PG -d {{.DB}} < manifests/db/{{.DB}}/seed.sql
        fi
        echo "Done!"

  db-seed:
    desc: Apply seed data only for <db>
    requires: { vars: [DB] }
    cmds:
      - |
        PG=$({{.PG_CMD}})
        $PG -d {{.DB}} < manifests/db/{{.DB}}/seed.sql

  db-inspect:
    desc: Inspect live <db> schema (SQL output)
    requires: { vars: [DB] }
    cmds:
      - |
        PG=$({{.PG_CMD}})
        ${PG/psql/pg_dump} -d {{.DB}} --schema-only --no-owner --no-privileges

  reset-db:
    desc: Nuke docker + volumes + rebuild from scratch (docker-compose only); reapplies all DBs
    cmds:
      - |
        set -euo pipefail
        task docker-down
        docker volume prune -af
        docker compose -f manifests/dockers/compose.yaml up -d
        echo "Waiting for PostgreSQL..."
        until docker exec dockers-postgres-1 pg_isready -U myuser -q 2>/dev/null; do sleep 1; done
        for d in manifests/db/*/; do
          task db-fresh DB="$(basename "$d")"
        done

  # ===========================================================================
  # Migrations (sqlx) — per DB
  # ===========================================================================
  # sqlx tracks applied migrations in _sqlx_migrations table per database.

  # (Single .up.sql per migration — Atlas Operator can't disambiguate up/down pairs.
  #  For local rollback during dev, use `task db-fresh DB=<db>` to reset from schema.sql.)
  migrate-add:
    desc: Create a new forward-only migration for <db>
    requires: { vars: [DB, NAME] }
    cmds:
      - |
        set -euo pipefail
        timestamp=$(date -u +%Y%m%d%H%M%S)
        mkdir -p manifests/db/{{.DB}}/migrations
        f="manifests/db/{{.DB}}/migrations/${timestamp}_{{.NAME}}.up.sql"
        echo "-- Migration: {{.NAME}}" > "$f"
        echo "Created: $f"
        echo "Edit, then run: task migrate DB={{.DB}}"

  migrate:
    desc: Apply pending migrations for <db> (local)
    requires: { vars: [DB] }
    cmds:
      - |
        {{.DB_URL_FN}}
        sqlx migrate run \
          --source manifests/db/{{.DB}}/migrations \
          --database-url "$(db_url {{.DB}} local)"

  migrate-cluster:
    desc: Apply migrations for <db> against kind cluster (port-forwarded :5433)
    requires: { vars: [DB] }
    cmds:
      - |
        {{.DB_URL_FN}}
        sqlx migrate run \
          --source manifests/db/{{.DB}}/migrations \
          --database-url "$(db_url {{.DB}} cluster)"

  migrate-status:
    desc: Show migration status for <db>
    requires: { vars: [DB] }
    cmds:
      - |
        {{.DB_URL_FN}}
        sqlx migrate info \
          --source manifests/db/{{.DB}}/migrations \
          --database-url "$(db_url {{.DB}} local)"

  migrate-baseline:
    desc: Mark existing migrations as applied without running them (use after db-fresh)
    requires: { vars: [DB] }
    cmds:
      - |
        set -euo pipefail
        PG=$({{.PG_CMD}})
        echo "Baselining {{.DB}} migrations..."
        $PG -d {{.DB}} -q -c "
          CREATE TABLE IF NOT EXISTS _sqlx_migrations (
            version BIGINT PRIMARY KEY,
            description TEXT NOT NULL,
            installed_on TIMESTAMPTZ NOT NULL DEFAULT now(),
            success BOOLEAN NOT NULL DEFAULT true,
            checksum BYTEA NOT NULL,
            execution_time BIGINT NOT NULL DEFAULT 0
          );
        "
        for f in manifests/db/{{.DB}}/migrations/*.sql; do
          [ -f "$f" ] || continue
          [[ "$(basename "$f")" == *.down.sql ]] && continue
          basename=$(basename "$f")
          version=$(echo "$basename" | grep -oE '^[0-9]+')
          description=$(echo "$basename" | sed -E 's/^[0-9]+_//' | sed -E 's/\.(up\.)?sql$//' | tr '_' ' ')
          checksum=$(cat "$f" | shasum -a 384 | awk '{print $1}')
          $PG -d {{.DB}} -q -c "
            INSERT INTO _sqlx_migrations (version, description, success, checksum, execution_time)
            VALUES ($version, '$description', true, '\x$checksum', 0)
            ON CONFLICT (version) DO UPDATE SET checksum = '\x$checksum';
          "
          echo "  Baselined: $basename"
        done
        echo "Done! Run 'task migrate-status DB={{.DB}}' to verify."

  migrate-test:
    desc: "Test migration path for <db>: drop → create → migrate → seed"
    requires: { vars: [DB] }
    cmds:
      - |
        set -euo pipefail
        {{.DB_URL_FN}}
        PG=$({{.PG_CMD}})
        echo "Testing {{.DB}} migration path..."
        $PG -d postgres -c \
          "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = '{{.DB}}' AND pid <> pg_backend_pid();" > /dev/null 2>&1 || true
        $PG -d postgres -c "DROP DATABASE IF EXISTS {{.DB}};"
        $PG -d postgres -c "CREATE DATABASE {{.DB}};"
        sqlx migrate run \
          --source manifests/db/{{.DB}}/migrations \
          --database-url "$(db_url {{.DB}} local)"
        if [ -f manifests/db/{{.DB}}/seed.sql ]; then
          $PG -d {{.DB}} < manifests/db/{{.DB}}/seed.sql
        fi
        echo "{{.DB}} migration test passed!"

  migrate-validate:
    desc: Verify schema.sql matches the result of running all migrations for <db>
    requires: { vars: [DB] }
    cmds:
      - |
        set -euo pipefail
        PG=$({{.PG_CMD}})
        PG_DUMP=${PG/psql/pg_dump}
        mig_db="{{.DB}}_migrate_validate"
        sch_db="{{.DB}}_schema_validate"
        echo "Validating {{.DB}}/schema.sql matches migrations..."
        $PG -d postgres -c "DROP DATABASE IF EXISTS $mig_db;" > /dev/null 2>&1
        $PG -d postgres -c "CREATE DATABASE $mig_db;"
        sqlx migrate run \
          --source manifests/db/{{.DB}}/migrations \
          --database-url "postgres://myuser:mypassword@localhost:5432/$mig_db?sslmode=disable"
        $PG -d postgres -c "DROP DATABASE IF EXISTS $sch_db;" > /dev/null 2>&1
        $PG -d postgres -c "CREATE DATABASE $sch_db;"
        $PG -d $sch_db < manifests/db/{{.DB}}/schema.sql
        migrate_dump=$($PG_DUMP -d $mig_db --schema-only --no-owner --no-privileges --no-comments \
          --exclude-table='_sqlx_migrations' | grep -v '^--' | grep -v '^$' | grep -vE '^\\(restrict|unrestrict)')
        schema_dump=$($PG_DUMP -d $sch_db --schema-only --no-owner --no-privileges --no-comments \
          | grep -v '^--' | grep -v '^$' | grep -vE '^\\(restrict|unrestrict)')
        $PG -d postgres -c "DROP DATABASE $mig_db;" > /dev/null 2>&1
        $PG -d postgres -c "DROP DATABASE $sch_db;" > /dev/null 2>&1
        if diff <(echo "$migrate_dump") <(echo "$schema_dump") > /dev/null 2>&1; then
          echo "PASS: {{.DB}} schema.sql and migrations produce identical schemas"
        else
          echo "FAIL: {{.DB}} schema.sql and migrations diverge!"
          echo ""
          diff <(echo "$migrate_dump") <(echo "$schema_dump") || true
          exit 1
        fi

  # ===========================================================================
  # K8s ConfigMap generation (Atlas Operator) — per DB
  # ===========================================================================

  gen-schema-configmap:
    desc: Generate schema ConfigMap for <db> (used by AtlasSchema declarative mode)
    requires: { vars: [DB] }
    cmds:
      - |
        set -euo pipefail
        mkdir -p manifests/db/{{.DB}}/k8s/base
        pg-cli configmap schema \
          --schema manifests/db/{{.DB}}/schema.sql \
          --name {{.DB}}-schema \
          -o manifests/db/{{.DB}}/k8s/base/schema-configmap.yaml

  # Run after any edit/add/delete of migration files; required by Atlas Operator.
  migrate-hash:
    desc: Recompute the Atlas checksum manifest (atlas.sum) for <db>'s migrations dir.
    requires: { vars: [DB] }
    cmds:
      - atlas migrate hash --dir "file://manifests/db/{{.DB}}/migrations"

  # Always re-hashes first so atlas.sum is consistent with the SQL files.
  gen-migrations-configmap:
    desc: Generate migrations ConfigMap for <db> (used by AtlasMigration versioned mode)
    requires: { vars: [DB] }
    cmds:
      - task: migrate-hash
        vars: { DB: '{{.DB}}' }
      - |
        set -euo pipefail
        mkdir -p manifests/db/{{.DB}}/k8s/base
        pg-cli configmap migrations \
          --migrations-dir manifests/db/{{.DB}}/migrations \
          --name {{.DB}}-migrations \
          -o manifests/db/{{.DB}}/k8s/base/migrations-configmap.yaml

  # Each DB in its own mode: versioned DBs get a migrations ConfigMap,
  # declarative ones a schema ConfigMap.
  gen-all-configmaps:
    desc: Regenerate ConfigMaps for every DB under manifests/db/
    cmds:
      - |
        set -euo pipefail
        for d in manifests/db/*/; do
          db=$(basename "$d")
          if [[ -d "$d/migrations" ]]; then
            task gen-migrations-configmap DB="$db"
          elif [[ -f "$d/schema.sql" ]]; then
            task gen-schema-configmap DB="$db"
          fi
        done

  # ===========================================================================
  # Cluster status (CNPG)
  # ===========================================================================

  cnpg-status:
    desc: Show CNPG cluster status (cluster-wide, not per-DB)
    vars:
      NS: '{{.NS | default "dbs"}}'
    cmds:
      - kubectl get clusters -n {{.NS}}
      - kubectl get pods -n {{.NS}} -l cnpg.io/cluster
      - cmd: echo ""
        silent: true
      - kubectl get atlasmigration -A -o wide 2>/dev/null || echo "No AtlasMigration resources found"

  cnpg-logs:
    desc: Tail CNPG logs
    vars:
      NS: '{{.NS | default "dbs"}}'
    cmds:
      - kubectl logs -n {{.NS}} -l cnpg.io/cluster --tail=100 -f
