# yaml-language-server: $schema=https://taskfile.dev/schema.json
# Local environment lifecycle (docker compose, kind, secrets) — included by the root Taskfile.yml.
version: '3'

tasks:
  docker-up:
    desc: Start local env dbs (Postgres, Redis, NATS) via Docker Compose
    cmds:
      - devkit dev up -d

  docker-down:
    desc: Remove local env db
    cmds:
      - devkit dev down

  # Generate + apply the shared Secret into the local kind cluster from vals refs.
  # `vals eval` resolves each ref+gcpsecrets:// at apply time (no plaintext on disk
  # or in git). A RANDOM name is stamped so it won't clobber the kustomize-managed
  # `zerg-shared-secrets` during migration — rename once deployments point at it.
  #   task kind-secret                                  # random name, namespace zerg
  #   task kind-secret NAME=my-secrets                  # explicit name
  #   task kind-secret NAME=my-secrets NAMESPACE=apps   # explicit name + namespace
  kind-secret:
    desc: Generate + apply the shared Secret into the local kind cluster from vals refs
    vars:
      NAMESPACE: '{{.NAMESPACE | default "zerg"}}'
    cmds:
      # One script: the random default name must be computed once and shared.
      - |
        set -e
        name="{{.NAME}}"
        name="${name:-$(printf "zerg-secrets-%s" "$(openssl rand -hex 4)")}"
        echo "$name" | grep -Eq '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$' || { echo "✗ invalid Secret name '$name' (RFC1123: lowercase alphanumeric/-). Use: task kind-secret NAME=<name> [NAMESPACE=<namespace>]"; exit 1; }
        kubectl create namespace {{.NAMESPACE}} --dry-run=client -o yaml | kubectl apply -f -
        vals eval -f manifests/secrets/secret.vals.yaml \
          | sed "s/SECRET_NAME_PLACEHOLDER/$name/" \
          | kubectl apply -n {{.NAMESPACE}} -f -
        echo "✓ applied Secret '$name' to namespace '{{.NAMESPACE}}' (random name — update refs, then rename)"

  local-up:
    desc: 'Start full local dev environment (Kind + DBs + Secrets + Tilt); extra devkit args after --'
    cmds:
      - devkit up {{.CLI_ARGS}}

  local-down:
    desc: 'Tear down local dev environment; extra devkit args after --'
    cmds:
      - devkit down {{.CLI_ARGS}}

  local-restart:
    desc: Quick restart (keep cluster, redeploy apps)
    cmds:
      - devkit down --keep-cluster
      - tilt up

  local-status:
    desc: Show environment status
    cmds:
      - devkit status

  # Credentials for the `x` CLI/TUI (apps/x/cli). Guarded routes reject an
  # anonymous request with 401; x sends either a bearer token ($X_TOKEN) or the
  # session cookie its OpenAPI document declares ($X_SESSION).

  # Mint a Keycloak access token for the local `terran` realm (direct-access grant,
  # 5-minute lifetime) and print it. Needs `docker compose up -d keycloak`:
  #   export X_TOKEN=$(task x-token)
  #   cargo run -p x_cli -- get assets
  # Overridable: EMAIL (the Keycloak username), PASSWORD, REALM, CLIENT, SECRET.
  x-token:
    desc: Mint a Keycloak access token for the local terran realm and print it
    silent: true
    vars:
      EMAIL: '{{.EMAIL | default "test@terran.dev"}}'
      PASSWORD: '{{.PASSWORD | default "test"}}'
      REALM: '{{.REALM | default "terran"}}'
      CLIENT: '{{.CLIENT | default "terran-api"}}'
      SECRET: '{{.SECRET | default "local-dev-secret"}}'
    cmds:
      - |
        curl -fsS -X POST "http://localhost:8088/realms/{{.REALM}}/protocol/openid-connect/token" \
          -H 'content-type: application/x-www-form-urlencoded' \
          -d grant_type=password -d "client_id={{.CLIENT}}" -d "client_secret={{.SECRET}}" \
          --data-urlencode "username={{.EMAIL}}" --data-urlencode "password={{.PASSWORD}}" \
          | jq -er .access_token

  # Log in to a running API through its own password route and print the session
  # cookie value. The cookie name is the one the document declares — read it with
  # `cargo run -p x_cli -- api show <api> | jq .components.securitySchemes`:
  #   export X_SESSION=$(task x-session ORIGIN=http://127.0.0.1:8080 COOKIE=zerg_session EMAIL=me@example.com PASSWORD=hunter2)
  x-session:
    desc: Log in to a running API through its password route and print the session cookie value
    silent: true
    requires:
      vars: [ORIGIN, COOKIE, EMAIL, PASSWORD]
    cmds:
      - |
        curl -fsS -D - -o /dev/null -X POST "{{.ORIGIN}}/api/auth/login/password" \
          -H 'content-type: application/json' \
          --data-binary "$(jq -nc --arg e '{{.EMAIL}}' --arg p '{{.PASSWORD}}' '{email:$e,password:$p}')" \
          | tr -d '\r' \
          | sed -n 's/^[Ss]et-[Cc]ookie: *{{.COOKIE}}=\([^;]*\).*/\1/p' \
          | head -n 1
