# yaml-language-server: $schema=https://taskfile.dev/schema.json
# KCL leaves — included (flattened) by the root Taskfile.yml.
#
# lint/test go through nx by TAG, the same shape as scripts/tasks/python.yml:
# a KCL package is a project whose project.json carries `lang:kcl`
# (scripts/kcl/ci/project.json today), and its `lint`/`test` targets run
# `kcl lint`/`kcl test` from the package root, where kcl.mod resolves the
# package's dependencies. A second package is gated the day it is tagged, with
# no edit here; with none tagged, nx runs nothing and exits 0.
#
# fmt stays a direct `kcl fmt` over the tree instead: formatting needs no
# kcl.mod, and it must reach .k files that belong to no package.
version: '3'

tasks:
  lint-kcl:
    desc: kcl lint over every project tagged lang:kcl
    cmds:
      - bun nx run-many -t lint -p tag:lang:kcl

  test-kcl:
    desc: kcl test over every project tagged lang:kcl
    cmds:
      - bun nx run-many -t test -p tag:lang:kcl

  # Scoped to scripts/kcl: `kcl fmt ./...` from the root walks node_modules and
  # target/ (14s vs 0.1s). Indent width comes from .editorconfig `[*.k]`.
  fmt-kcl:
    desc: Format every KCL file (kcl fmt)
    cmds:
      - kcl fmt ./scripts/kcl/...

  fmt-check-kcl:
    desc: KCL formatting gate — fails when `fmt-kcl` would change a file
    cmds:
      - kcl fmt --dry-run ./scripts/kcl/...
