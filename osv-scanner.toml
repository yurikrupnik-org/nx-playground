# Advisories acknowledged as not actionable.
#
# `just scan` is `osv-scanner --recursive .`, so it reads EVERY Cargo.lock in
# the tree; `just audit` is `cargo audit`, which reads exactly one — the root
# Cargo.lock. The two ignore lists are therefore in sync only for advisories
# that reach the root lock. Keep them in sync for those.

[[IgnoredVulns]]
id = "RUSTSEC-2026-0235"
reason = "rkyv 0.7 is a lockfile-only optional dep of rust_decimal, never compiled (cargo tree -i rkyv -e all --target all: not in graph); no semver-compatible fix exists"

# The two below do NOT reach the root lock. `apps/todo/web-leptos` is in the
# root Cargo.toml `[workspace] exclude` list, which is what gives it a second,
# separate Cargo.lock — and `cargo audit` never opens that file. Adding these
# ids to the justfile `audit` recipe would therefore be a dead ignore that
# cargo-audit reports as unused and someone later deletes as noise.
#
# DO NOT "tidy" this by syncing the two lists. The asymmetry is a direct
# consequence of the crate being excluded from the cargo workspace; it goes
# away only when that crate stops having its own lockfile.

[[IgnoredVulns]]
id = "RUSTSEC-2024-0436"
reason = "paste 1.0.15 is unmaintained with no successor release; it is a BUILD-TIME proc-macro pulled in transitively by leptos/tachys/reactive_graph (cargo tree -i paste), so nothing of it ships in the wasm. Drops when leptos stops depending on it."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0173"
reason = "proc-macro-error2 2.0.1 is unmaintained with no semver-compatible fix; another BUILD-TIME proc-macro, reached only through leptos_macro / reactive_stores_macro / syn_derive (cargo tree -i proc-macro-error2). Drops when leptos_macro migrates off it."
