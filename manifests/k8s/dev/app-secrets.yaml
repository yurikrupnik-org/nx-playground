# Dev-only Secret fixtures for the zerg apps, one home for all of them.
#
# These are NOT workload shape, so they do not live in an app's `[workload]`:
# they are environment fixtures — placeholder credentials that let a local kind
# cluster start. Real deployments get the same keys from the ExternalSecret each
# app declares in `[env.prod.externalSecret]`, which the external-secrets
# controller fills from GCP Secret Manager.
#
# They were `secretGenerator` literals in each app's dev kustomize overlay before
# the manifests became generated output; the `app` KCL package renders
# ExternalSecrets but not literal Secrets, and inventing a plaintext-secret field
# in butler.toml would spread dummy credentials across eleven config files.
#
# Referenced from the generated aggregate through the root butler.toml
# `[k8s] extraResources` list.
apiVersion: v1
kind: Secret
metadata:
  name: zerg-api-secrets
  namespace: zerg
type: Opaque
stringData:
  DATABASE_URL: postgres://myuser:mypassword@postgres.dbs.svc.cluster.local/zerg
  # WorkOS AuthKit creds — replace with your environment's values.
  WORKOS_CLIENT_ID: client_replace-me
  WORKOS_API_KEY: sk_replace-me
---
apiVersion: v1
kind: Secret
metadata:
  name: zerg-email-nats-secrets
  namespace: zerg
type: Opaque
stringData:
  # MailHog needs no auth locally; the keys must exist because the Deployment
  # reads them through envFrom.
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: zerg-tasks-secrets
  namespace: zerg
type: Opaque
stringData:
  DATABASE_URL: postgres://myuser:mypassword@postgres.dbs.svc.cluster.local/tasks
  # Verification-only: the service derives the tenant from the caller's token
  # (apps/zerg/tasks/src/auth.rs) and never calls the WorkOS management API, so
  # it gets no WORKOS_API_KEY.
  WORKOS_CLIENT_ID: client_replace-me
