# Holds the HTTPRoutes in base/gateway. Identical to
# gitops-v1 infrastructure/platform/networking-config/base/namespace.yaml, so
# Flux reconciling the platform later is a no-op instead of a conflict.
apiVersion: v1
kind: Namespace
metadata:
  name: gateway
  labels:
    app.kubernetes.io/part-of: gateway
    istio-injection: enabled
---
apiVersion: v1
kind: Namespace
metadata:
  name: zerg
  labels:
    postgres.shared/enabled: "true"
    secrets.external-secrets.io/enabled: "true"
    istio-injection: enabled
---
