# CI declaration for this repo - consumed by scripts/kcl/ci (see loader.k).
# Languages listed here control which toolchains the generated CI sets up.
# Validated against MonorepoConfig; invalid values fail generation.
name: nx-playground
main_branch: main
monorepo_tool: nx
package_manager: bun
# Valid values: typescript | rust | go | python | java | kcl (schemas/common.k).
# Toolchains that are not languages come from package_manager (bun) and
# python_manager (uv) below, not from this list.
languages: [typescript, rust, python, kcl]
python_manager: uv
nx_cloud: true
use_affected: true
use_mise: false
use_sccache: true
sccache_provider: gcp
