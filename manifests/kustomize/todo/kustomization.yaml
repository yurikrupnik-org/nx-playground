# Todo vertical infrastructure (namespace + Postgres + NATS) for the local
# kind cluster. App workloads live beside their code:
#   apps/todo/{api,worker,web}/k8s/kustomize/overlays/dev
# Deploy everything with: just todo-deploy
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: todo
resources:
  - namespace.yaml
  - ../../db/todo/k8s/base
  - postgres.yaml
  - nats.yaml
