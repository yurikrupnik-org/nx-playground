apiVersion: v1
kind: ConfigMap
metadata:
  name: zerg-schema
  namespace: dbs
  labels:
    app.kubernetes.io/component: schema
    app.kubernetes.io/name: zerg-schema
data:
  schema.sql: |
    -- Desired Database Schema (single source of truth — zerg has no migrations)
    -- Local dev: `just db-fresh zerg` drops/recreates the DB from this file + seed.sql
    -- K8s:       Atlas Operator reconciles it declaratively (AtlasSchema + zerg-schema ConfigMap)
    -- Change flow: edit this file → `just db-fresh zerg` → `just gen-schema-configmap zerg`
    -- PostgreSQL 18 (uuidv7() is a built-in function, no extension required)

    -- =============================================================================
    -- Extensions
    -- =============================================================================
    CREATE EXTENSION IF NOT EXISTS pgcrypto;
    CREATE EXTENSION IF NOT EXISTS hstore;
    -- CREATE EXTENSION IF NOT EXISTS vector;
    -- CREATE EXTENSION IF NOT EXISTS postgis;

    -- =============================================================================
    -- Schemas
    -- =============================================================================
    CREATE SCHEMA IF NOT EXISTS util;

    -- =============================================================================
    -- Utility Functions
    -- =============================================================================
    CREATE OR REPLACE FUNCTION util.touch_updated_at()
    RETURNS trigger AS $$
    BEGIN
      NEW.updated_at = NOW();
      RETURN NEW;
    END;
    $$ LANGUAGE plpgsql;

    -- =============================================================================
    -- Enum Types
    -- =============================================================================
    -- `task_priority`/`task_status` moved to the tasks database with their table.
    CREATE TYPE cloud_provider AS ENUM ('aws', 'gcp', 'azure');
    CREATE TYPE environment AS ENUM ('development', 'staging', 'production');
    CREATE TYPE project_status AS ENUM ('provisioning', 'active', 'suspended', 'deleting', 'archived');
    CREATE TYPE resource_type AS ENUM ('compute', 'storage', 'database', 'network', 'serverless', 'analytics', 'other');
    CREATE TYPE resource_status AS ENUM ('creating', 'active', 'updating', 'deleting', 'deleted', 'failed');

    -- =============================================================================
    -- Tables
    -- =============================================================================

    -- Users table (credentials live at the IdP — WorkOS; `subject` is the IdP user id)
    CREATE TABLE users (
      id UUID PRIMARY KEY DEFAULT uuidv7(),
      email VARCHAR(255) NOT NULL,
      name VARCHAR(255) NOT NULL,
      avatar_url TEXT,
      roles TEXT[] NOT NULL DEFAULT ARRAY['user'::text],
      email_verified BOOLEAN NOT NULL DEFAULT false,
      is_active BOOLEAN NOT NULL DEFAULT true,
      last_login_at TIMESTAMPTZ,
      created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
      updated_at TIMESTAMPTZ NOT NULL DEFAULT now(),
      subject TEXT
    );

    CREATE UNIQUE INDEX idx_users_email ON users(email);
    CREATE UNIQUE INDEX idx_users_subject ON users(subject) WHERE subject IS NOT NULL;

    -- Organizations (WorkOS org mirror; personal workspaces use external id 'personal:{subject}')
    CREATE TABLE organizations (
      id UUID PRIMARY KEY DEFAULT uuidv7(),
      external_org_id TEXT NOT NULL UNIQUE,
      name TEXT NOT NULL,
      created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    -- Memberships (local mirror of WorkOS org memberships; role is the WorkOS role slug)
    CREATE TABLE memberships (
      user_id UUID NOT NULL REFERENCES users(id) ON DELETE CASCADE,
      org_id UUID NOT NULL REFERENCES organizations(id) ON DELETE CASCADE,
      role TEXT NOT NULL DEFAULT 'member',
      created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
      PRIMARY KEY (user_id, org_id)
    );

    -- Projects table
    CREATE TABLE projects (
      id UUID PRIMARY KEY DEFAULT uuidv7(),
      name VARCHAR(255) NOT NULL,
      user_id UUID NOT NULL,
      description TEXT NOT NULL DEFAULT '',
      cloud_provider cloud_provider NOT NULL,
      region VARCHAR(255) NOT NULL,
      environment environment NOT NULL DEFAULT 'development',
      status project_status NOT NULL DEFAULT 'provisioning',
      budget_limit DOUBLE PRECISION,
      tags JSONB NOT NULL DEFAULT '{}',
      enabled BOOLEAN NOT NULL DEFAULT true,
      repository_url VARCHAR(500),
      created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
      updated_at TIMESTAMPTZ NOT NULL DEFAULT now(),
      CONSTRAINT fk_projects_user FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE,
      CONSTRAINT chk_budget_positive CHECK (budget_limit >= 0)
    );

    CREATE INDEX idx_projects_user_id ON projects(user_id);
    CREATE INDEX idx_projects_user_status ON projects(user_id, status);
    CREATE UNIQUE INDEX uq_project_name_per_user ON projects(user_id, name);

    -- NOTE: the `tasks` table lives in its own database (`manifests/db/tasks/schema.sql`),
    -- owned exclusively by `apps/zerg/tasks`. zerg reaches tasks over gRPC only.
    -- See docs/adr-tasks-service-boundary.md.

    -- Cloud resources table
    CREATE TABLE cloud_resources (
      id UUID PRIMARY KEY DEFAULT uuidv7(),
      project_id UUID NOT NULL,
      name VARCHAR(255) NOT NULL,
      resource_type resource_type NOT NULL,
      status resource_status NOT NULL DEFAULT 'creating',
      region VARCHAR(255) NOT NULL,
      configuration JSONB NOT NULL DEFAULT '{}',
      cost_per_hour DOUBLE PRECISION,
      monthly_cost_estimate DOUBLE PRECISION,
      tags JSONB NOT NULL DEFAULT '{}',
      enabled BOOLEAN NOT NULL DEFAULT true,
      created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
      updated_at TIMESTAMPTZ NOT NULL DEFAULT now(),
      deleted_at TIMESTAMPTZ,
      CONSTRAINT fk_cloud_resources_project FOREIGN KEY (project_id) REFERENCES projects(id) ON DELETE CASCADE,
      CONSTRAINT chk_cost_positive CHECK (cost_per_hour >= 0 AND monthly_cost_estimate >= 0)
    );

    CREATE INDEX idx_cloud_resources_project_id ON cloud_resources(project_id);
    CREATE UNIQUE INDEX unique_resource_name_per_project ON cloud_resources(project_id, name);

    -- =============================================================================
    -- Triggers
    -- =============================================================================
    CREATE TRIGGER users_touch_updated_at
      BEFORE UPDATE ON users
      FOR EACH ROW
      EXECUTE FUNCTION util.touch_updated_at();

    CREATE TRIGGER projects_touch_updated_at
      BEFORE UPDATE ON projects
      FOR EACH ROW
      EXECUTE FUNCTION util.touch_updated_at();

    CREATE TRIGGER cloud_resources_touch_updated_at
      BEFORE UPDATE ON cloud_resources
      FOR EACH ROW
      EXECUTE FUNCTION util.touch_updated_at();
