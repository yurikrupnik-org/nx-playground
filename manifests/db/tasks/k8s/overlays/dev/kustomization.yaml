apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace omitted on purpose - Flux's parent Kustomization sets targetNamespace.

resources:
  - ../../base

generatorOptions:
  disableNameSuffixHash: true

# The credential the Atlas operator uses to reconcile schema.sql. It is the
# schema OWNER, deliberately not the `tasks_app` CRUD role from roles.sql —
# tasks_app is NOCREATEDB with table-level grants only and cannot run DDL.
# Dev runs both as the superuser; splitting them is architecture-backlog 2.4.
secretGenerator:
  - name: tasks-shared-secrets
    literals:
      - DATABASE_URL=postgres://myuser:mypassword@postgres.dbs.svc.cluster.local/tasks
