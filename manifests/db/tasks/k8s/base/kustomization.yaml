apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace omitted on purpose - Flux's parent Kustomization sets targetNamespace.

# tasks is declarative-only: schema.sql is the single source of truth, there is no
# migrations directory. The operator diffs the live DB against tasks-schema.
#
# This database belongs to `apps/zerg/tasks` alone; `zerg_api` holds no credentials
# for it. See docs/adr-tasks-service-boundary.md.
resources:
  - schema-configmap.yaml
  - atlas-schema.yaml
