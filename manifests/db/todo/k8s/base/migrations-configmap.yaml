  20240101000000_init.sql: |
    -- Todo vertical schema (standalone).
    -- Applied by todo-api on startup and by test-utils TestDatabase::with_migrations_dir in tests.

    -- Priority enum used by the todos table.
    DO $$ BEGIN
        CREATE TYPE todo_priority AS ENUM ('low', 'medium', 'high');
    EXCEPTION
        WHEN duplicate_object THEN null;
    END $$;

    CREATE TABLE IF NOT EXISTS todos (
        id          UUID PRIMARY KEY,
        title       VARCHAR(255) NOT NULL,
        description TEXT NOT NULL DEFAULT '',
        completed   BOOLEAN NOT NULL DEFAULT false,
        priority    todo_priority NOT NULL DEFAULT 'medium',
        created_at  TIMESTAMPTZ NOT NULL DEFAULT now(),
        updated_at  TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    CREATE INDEX IF NOT EXISTS idx_todos_completed ON todos (completed);
    CREATE INDEX IF NOT EXISTS idx_todos_created_at ON todos (created_at DESC);
  20260827000000_stack_profiles.sql: |
    -- Frontend stack profiles for the todo vertical comparison page.
    --
    -- Reference data answering "which UI language is the default and which is
    -- cheapest to ship", measured against the production build of todo web-astro
    -- (raw transfer, uncompressed, 2026-08-27). Served by todo-api at
    -- GET /api/stacks and rendered by web-astro's landing page.
    --
    -- The cluster DB (CNPG + Atlas migrations ConfigMap) is the source of truth:
    -- change values via a follow-up migration, not by hand.

    CREATE TABLE IF NOT EXISTS stack_profiles (
        slug       VARCHAR(64) PRIMARY KEY,
        name       VARCHAR(128) NOT NULL,
        language   VARCHAR(128) NOT NULL,
        is_default BOOLEAN NOT NULL DEFAULT false,
        js_kb      REAL NOT NULL,      -- client JS transfer at first render
        html_kb    REAL NOT NULL,      -- initial document transfer
        requests   INTEGER NOT NULL,   -- subresource requests to first render
        notes      TEXT NOT NULL DEFAULT '',
        updated_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    -- At most one stack may be flagged as the default.
    CREATE UNIQUE INDEX IF NOT EXISTS idx_stack_profiles_single_default
        ON stack_profiles ((true)) WHERE is_default;

    INSERT INTO stack_profiles (slug, name, language, is_default, js_kb, html_kb, requests, notes) VALUES
        ('solid-island', 'Solid island', 'TypeScript (SolidJS)', true, 26.3, 8.3, 5,
         'Workspace default: every web app in this repo is Solid. Typed end-to-end via ts-rs DTOs.'),
        ('htmx', 'HTML + htmx', 'HTML (htmx over the API)', false, 58.9, 5.0, 1,
         'Zero app JS; the server renders fragments. htmx itself is ~16 kB once gzipped at the ingress.'),
        ('static-html', 'Static HTML', 'HTML + CSS only', false, 0, 6.8, 0,
         'No interactivity: cheapest possible output and the baseline for the other two.')
    ON CONFLICT (slug) DO NOTHING;
  20260828133022_todo_notify.up.sql: |
    -- Realtime UI support: make the DATABASE the source of todo change events.
    --
    -- Before this, browsers only saw changes that happened inside the todo-api
    -- process that owned their SSE/WebSocket connection: a second API replica, the
    -- todo-worker, the todo CLI or a plain `psql` UPDATE moved the data without any
    -- UI noticing. A row-level AFTER trigger emits NOTIFY on `todo_events` instead,
    -- so every committed change reaches every connected client regardless of which
    -- writer made it.
    --
    -- Payload is deliberately tiny — `{"kind": ..., "id": ...}` — because NOTIFY
    -- payloads are capped (8000 bytes) and `todos.description` is unbounded TEXT.
    -- The listener hydrates the full row itself, which also refreshes its cache.
    --
    -- NOTIFY is transactional: it fires on COMMIT, so clients never observe a change
    -- that later rolls back.

    CREATE OR REPLACE FUNCTION todo_notify() RETURNS trigger AS $$
    DECLARE
        event_kind text;
        row_id     uuid;
    BEGIN
        IF TG_OP = 'INSERT' THEN
            event_kind := 'created';
            row_id     := NEW.id;
        ELSIF TG_OP = 'DELETE' THEN
            event_kind := 'deleted';
            row_id     := OLD.id;
        ELSE
            row_id := NEW.id;
            -- Mirror the TodoEventKind variants the service publishes, so a change
            -- made in SQL is indistinguishable from one made through the API.
            IF NEW.completed AND NOT OLD.completed THEN
                event_kind := 'completed';
            ELSIF OLD.completed AND NOT NEW.completed THEN
                event_kind := 'uncompleted';
            ELSE
                event_kind := 'updated';
            END IF;
        END IF;

        PERFORM pg_notify(
            'todo_events',
            json_build_object('kind', event_kind, 'id', row_id)::text
        );

        -- AFTER ... FOR EACH ROW: the return value is ignored.
        RETURN NULL;
    END;
    $$ LANGUAGE plpgsql;

    DROP TRIGGER IF EXISTS todos_notify ON todos;

    CREATE TRIGGER todos_notify
        AFTER INSERT OR UPDATE OR DELETE ON todos
        FOR EACH ROW EXECUTE FUNCTION todo_notify();
