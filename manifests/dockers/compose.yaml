services:
  mongo:
    image: "mongo"
    ports:
      - "27017:27017"
  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"
  postgres:
    image: "postgres"
    environment:
      POSTGRES_DB: zerg
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      # Performance tuning for development/benchmarking
      # Adjust based on your system's available RAM
      POSTGRES_SHARED_BUFFERS: "512MB" # 25% of RAM for caching (default: 128MB)
      POSTGRES_EFFECTIVE_CACHE_SIZE: "2GB" # 50-75% of RAM (planner hint)
      POSTGRES_WORK_MEM: "16MB" # Per-query operation memory (default: 4MB)
      POSTGRES_MAINTENANCE_WORK_MEM: "128MB" # VACUUM, CREATE INDEX memory (default: 64MB)
      POSTGRES_MAX_CONNECTIONS: "200" # Match application pool (default: 100)
      POSTGRES_WAL_BUFFERS: "16MB" # WAL buffer size (default: -1)
      POSTGRES_CHECKPOINT_COMPLETION_TARGET: "0.9" # Spread checkpoint I/O (default: 0.5)
      POSTGRES_RANDOM_PAGE_COST: "1.1" # Lower for SSD (default: 4.0)
      POSTGRES_EFFECTIVE_IO_CONCURRENCY: "200" # SSD concurrent I/O (default: 1)
    ports:
      - "5432:5432"
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=2GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydatabase"]
      interval: 10s
      timeout: 5s
      retries: 5
  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
  nats:
    image: nats:2.10-alpine
    container_name: nats
    restart: always
    ports:
      - "4222:4222" # Client connections
      - "8222:8222" # HTTP monitoring
      - "6222:6222" # Cluster routing (optional)
    command: ["--jetstream", "-m", "8222"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
  influxdb2:
    image: influxdb:2
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: strongpassword
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: admintoken123
      DOCKER_INFLUXDB_INIT_ORG: docs
      DOCKER_INFLUXDB_INIT_BUCKET: home

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: always
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC API (optional)
    volumes:
      #      - qdrant_data:/qdrant/storage
      - ./config:/qdrant/config
    environment:
      #      - QDRANT__SERVICE__API_KEY=your-secret-key-here
      - QDRANT__LOG_LEVEL=INFO
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - qdrant-network
  flagsmith:
    image: flagsmith/flagsmith:latest
    container_name: flagsmith
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://myuser:mypassword@postgres:5432/flagsmith
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_SECRET_KEY: local-dev-flagsmith-secret-change-me
      ENABLE_ADMIN_ACCESS_USER_PASS: "True"
    ports:
      - "8000:8000"
  directus:
    image: directus/directus:latest
    container_name: directus
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KEY: local-dev-directus-key
      SECRET: local-dev-directus-secret
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: directus
      DB_USER: myuser
      DB_PASSWORD: mypassword
      ADMIN_EMAIL: admin@terran.dev
      ADMIN_PASSWORD: admin
      WEBSOCKETS_ENABLED: "true"
    ports:
      - "8055:8055"
volumes:
  influxdb2-data:
  influxdb2-config:
  qdrant_data:
  rabbitmq_data:
networks:
  qdrant-network:
    driver: bridge

# JetBrains
# jdbc:postgresql://localhost:5432/mydatabase?user=myuser&password=mypassword
