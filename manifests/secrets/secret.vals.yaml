# Kubernetes Secret template for local kind, resolved by `vals eval`.
# `just kind-secret` runs `vals eval -f` on this file (resolving each
# ref+gcpsecrets:// against GCP Secret Manager) and applies the result — no
# plaintext ever touches disk or git. The name is a placeholder swapped for a
# random one at apply time (see the `kind-secret` recipe); rename once the
# deployments reference the final Secret name.
apiVersion: v1
kind: Secret
metadata:
  name: SECRET_NAME_PLACEHOLDER
type: Opaque
stringData:
  OPENAI: ref+gcpsecrets://playground-447016/manager-secrets#/ai/openai
  ANTHROPIC: ref+gcpsecrets://playground-447016/manager-secrets#/ai/anthropic
  GITHUB1: ref+gcpsecrets://playground-447016/manager-secrets#/github1
  CARGO: ref+gcpsecrets://playground-447016/manager-secrets#/cargo
  CRATE: ref+gcpsecrets://playground-447016/crates-token
  DOCKER_SECRET: ref+gcpsecrets://playground-447016/docker-secret
  GITHUB_SECRET: ref+gcpsecrets://playground-447016/github-secret
