syntax = "proto3";

package tasks.v1;

option go_package = "grpc/tasks/v1";

// Optimized TasksService with binary serialization
service TasksService {
  rpc Create(CreateRequest) returns (CreateResponse) {}
  rpc GetById(GetByIdRequest) returns (GetByIdResponse) {}
  rpc DeleteById(DeleteByIdRequest) returns (DeleteByIdResponse) {}
  rpc UpdateById(UpdateByIdRequest) returns (UpdateByIdResponse) {}
  rpc List(ListRequest) returns (ListResponse) {}
  rpc ListStream(ListStreamRequest) returns (stream ListStreamResponse) {}
}

// Enums use 1 byte instead of 4-6 bytes for strings
enum Priority {
  PRIORITY_UNSPECIFIED = 0;
  PRIORITY_LOW = 1;
  PRIORITY_MEDIUM = 2;
  PRIORITY_HIGH = 3;
  PRIORITY_URGENT = 4;
}

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_TODO = 1;
  STATUS_IN_PROGRESS = 2;
  STATUS_DONE = 3;
}

message CreateRequest {
  string title = 1;
  string description = 2;
  // UUIDs as bytes: 16 bytes instead of 36-char string
  optional bytes project_id = 3;
  Priority priority = 4; // 1 byte enum instead of string
  Status status = 5; // 1 byte enum instead of string
  // Unix timestamp (seconds): 8 bytes instead of 24+ char ISO8601
  optional int64 due_date = 6;
  // Identity is NOT a request field. The service derives org_ref/user_ref from the
  // caller's verified access token (see docs/adr-tasks-service-boundary.md Phase 4).
  reserved 7, 8;
  reserved "org_id", "user_id";
}

message CreateResponse {
  bytes id = 1; // 16 bytes UUID
  string title = 2;
  string description = 3;
  bool completed = 4;
  optional bytes project_id = 5;
  Priority priority = 6;
  Status status = 7;
  optional int64 due_date = 8;
  int64 created_at = 9; // Unix timestamp
  int64 updated_at = 10;
  reserved 11, 12;
  reserved "org_id", "user_id";
  // Identity-provider refs (org_01... / user_01... / personal:{subject}).
  string org_ref = 13;
  string user_ref = 14;
}

message GetByIdRequest {
  bytes id = 1; // Binary UUID
  reserved 2;
  reserved "org_id";
}

message GetByIdResponse {
  bytes id = 1;
  string title = 2;
  string description = 3;
  bool completed = 4;
  optional bytes project_id = 5;
  Priority priority = 6;
  Status status = 7;
  optional int64 due_date = 8;
  int64 created_at = 9;
  int64 updated_at = 10;
  reserved 11, 12;
  reserved "org_id", "user_id";
  // Identity-provider refs (org_01... / user_01... / personal:{subject}).
  string org_ref = 13;
  string user_ref = 14;
}

message UpdateByIdRequest {
  bytes id = 1;
  optional string title = 2;
  optional string description = 3;
  optional bool completed = 4;
  optional bytes project_id = 5;
  optional Priority priority = 6;
  optional Status status = 7;
  optional int64 due_date = 8;
  reserved 9;
  reserved "org_id";
}

message UpdateByIdResponse {
  bytes id = 1;
  string title = 2;
  string description = 3;
  bool completed = 4;
  optional bytes project_id = 5;
  Priority priority = 6;
  Status status = 7;
  optional int64 due_date = 8;
  int64 created_at = 9;
  int64 updated_at = 10;
  reserved 11, 12;
  reserved "org_id", "user_id";
  // Identity-provider refs (org_01... / user_01... / personal:{subject}).
  string org_ref = 13;
  string user_ref = 14;
}

message DeleteByIdRequest {
  bytes id = 1;
  reserved 2;
  reserved "org_id";
}

message DeleteByIdResponse {}

message ListRequest {
  optional bytes project_id = 1;
  optional Status status = 2;
  optional Priority priority = 3;
  optional bool completed = 4;
  int32 limit = 5; // int32 instead of string
  int32 offset = 6; // int32 instead of string
  reserved 7, 8;
  reserved "org_id", "user_id";
  // Narrow to the caller's own tasks. The request can say *whether* to narrow,
  // never *whose* tasks to fetch - "someone else's tasks" is now inexpressible.
  bool mine = 9;
}

message ListResponse {
  repeated CreateResponse data = 1;
}

message ListStreamRequest {
  optional bytes project_id = 1;
  optional Status status = 2;
  optional Priority priority = 3;
  optional bool completed = 4;
  int32 limit = 5;
  reserved 6, 7;
  reserved "org_id", "user_id";
  bool mine = 8;
}

message ListStreamResponse {
  bytes id = 1;
  string title = 2;
  string description = 3;
  bool completed = 4;
  optional bytes project_id = 5;
  Priority priority = 6;
  Status status = 7;
  optional int64 due_date = 8;
  int64 created_at = 9;
  int64 updated_at = 10;
  reserved 11, 12;
  reserved "org_id", "user_id";
  // Identity-provider refs (org_01... / user_01... / personal:{subject}).
  string org_ref = 13;
  string user_ref = 14;
}
