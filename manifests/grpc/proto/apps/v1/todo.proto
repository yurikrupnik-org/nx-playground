syntax = "proto3";

package todo.v1;

option go_package = "grpc/todo/v1";

// The todo vertical's gRPC transport. Served by `todo_api` on the SAME port
// as REST, SSE and WebSocket (axum multiplexes h2c), over the same
// `TodoService` and the same database-sourced event bus, so it is a fourth
// way to reach one backend rather than a second backend.
//
// Wire choices, deliberately different from tasks.v1: ids are UUID text and
// timestamps are unix milliseconds, so `grpcurl` output lines up with the
// JSON the other three transports emit (see docs/todo-delivery-options.md).
service TodoService {
  rpc List(ListRequest) returns (ListResponse) {}
  rpc Get(GetRequest) returns (Todo) {}
  rpc Create(CreateRequest) returns (Todo) {}
  // PATCH semantics: only set fields change.
  rpc Update(UpdateRequest) returns (Todo) {}
  rpc Delete(DeleteRequest) returns (DeleteResponse) {}
  // Intent-revealing transitions (the REST router exposes the same two).
  rpc Complete(CompleteRequest) returns (Todo) {}
  rpc Uncomplete(UncompleteRequest) returns (Todo) {}
  // Server stream of lifecycle events. Sourced from the Postgres
  // `todos_notify` trigger like `/api/events/sse`: any writer is visible.
  // No backlog — a client that reconnects must re-`List`.
  rpc Watch(WatchRequest) returns (stream TodoEvent) {}
}

enum Priority {
  PRIORITY_UNSPECIFIED = 0;
  PRIORITY_LOW = 1;
  PRIORITY_MEDIUM = 2;
  PRIORITY_HIGH = 3;
}

enum EventKind {
  EVENT_KIND_UNSPECIFIED = 0;
  EVENT_KIND_CREATED = 1;
  EVENT_KIND_UPDATED = 2;
  EVENT_KIND_COMPLETED = 3;
  EVENT_KIND_UNCOMPLETED = 4;
  EVENT_KIND_DELETED = 5;
}

message Todo {
  string id = 1;
  string title = 2;
  string description = 3;
  bool completed = 4;
  Priority priority = 5;
  int64 created_at_ms = 6;
  int64 updated_at_ms = 7;
}

message ListRequest {
  optional bool completed = 1;
  optional Priority priority = 2;
  // 0 means the service default (50).
  uint32 limit = 3;
  uint32 offset = 4;
}

message ListResponse {
  repeated Todo todos = 1;
}

message GetRequest {
  string id = 1;
}

message CreateRequest {
  string title = 1;
  string description = 2;
  // PRIORITY_UNSPECIFIED means the domain default (medium).
  Priority priority = 3;
}

message UpdateRequest {
  string id = 1;
  optional string title = 2;
  optional string description = 3;
  optional bool completed = 4;
  optional Priority priority = 5;
}

message DeleteRequest {
  string id = 1;
}

message DeleteResponse {}

message CompleteRequest {
  string id = 1;
}

message UncompleteRequest {
  string id = 1;
}

message WatchRequest {}

// Mirrors `domain_todo::TodoEvent`: `todo` is absent only for DELETED.
message TodoEvent {
  string event_id = 1;
  EventKind kind = 2;
  string todo_id = 3;
  optional Todo todo = 4;
  int64 occurred_at_ms = 5;
}
