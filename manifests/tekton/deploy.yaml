    description: Git URL to clone.
    default: https://github.com/yurikrupnik-org/nx-playground.git
  - name: revision
    type: string
    description: Branch, tag or commit to run.
    default: main
  workspaces:
  - name: source
    description: Scratch space for the checkout.
  - name: dockerconfig
    description: 'Registry credentials for the push: a docker config.json.'
    optional: true
  tasks:
  - name: clone
    taskRef:
      name: butler-git-clone
      kind: Task
    params:
    - name: url
      value: $(params.url)
    - name: revision
      value: $(params.revision)
    workspaces:
    - name: source
      workspace: source
  - name: nx-build
    runAfter:
    - clone
    taskRef:
      name: butler-nx
      kind: Task
    params:
    - name: project
      value: zerg-web
    - name: target
      value: build
    workspaces:
    - name: source
      workspace: source
  - name: image
    runAfter:
    - nx-build
    taskRef:
      name: butler-buildkit
      kind: Task
    params:
    - name: image
      value: yurikrupnik/zerg-web:dev
    - name: dockerfile
      value: manifests/dockers/Dockerfile
    - name: context
      value: .
    - name: target
      value: nginx
    - name: build-args
      value:
      - DIST_PATH=apps/zerg/web/dist
    workspaces:
    - name: source
      workspace: source
    - name: dockerconfig
      workspace: dockerconfig
  - name: deploy
    runAfter:
    - image
    taskRef:
      name: butler-kubectl-apply
      kind: Task
    params:
    - name: manifest
      value: manifests/k8s/dev/zerg-web.yaml
    - name: image
      value: yurikrupnik/zerg-web:dev
    - name: digest
      value: $(tasks.image.results.digest)
    workspaces:
    - name: source
      workspace: source
