    - name: VERSION
      value: 3.53.1
    script: |
      #!/bin/sh
      set -eu
      case "$(uname -m)" in
        x86_64) arch=amd64 ;;
        aarch64 | arm64) arch=arm64 ;;
        *) echo "no go-task build for $(uname -m)" >&2; exit 1 ;;
      esac
      archive="task_linux_${arch}.tar.gz"
      member=task
      sums=task_checksums.txt
      base="https://github.com/go-task/task/releases/download/v${VERSION}"
