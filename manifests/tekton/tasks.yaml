apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: butler-git-clone
  labels:
    app.kubernetes.io/managed-by: butler
spec:
  description: Shallow-clone one revision of the repository into the source workspace.
  params:
  - name: url
    type: string
    description: Git URL to clone.
  - name: revision
    type: string
    description: Branch, tag or commit to check out.
  workspaces:
  - name: source
    description: Receives the checkout.
  steps:
  - name: clone
    image: alpine/git:2.54.0
    computeResources: {}
    env:
    - name: URL
      value: $(params.url)
    - name: REVISION
      value: $(params.revision)
    script: |
      #!/bin/sh
      set -eu
      cd "$(workspaces.source.path)"
      # A reused volume still holds the previous checkout.
      find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
      git init -q .
      git remote add origin "$URL"
      git fetch -q --depth 1 origin "$REVISION"
      git checkout -q FETCH_HEAD
      git log -1 --format='%H %s'
---
