apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: butler-task
  labels:
    app.kubernetes.io/managed-by: butler
spec:
  description: Download go-task, then `task <task>` in the source workspace.
  params:
  - name: task
    type: string
    description: Taskfile task name, namespaced as `task --list-all` prints it.
  - name: args
    type: array
    description: Extra arguments after the target.
    default: []
  workspaces:
  - name: source
