apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: butler-buildkit
  labels:
    app.kubernetes.io/managed-by: butler
spec:
  description: Build one Dockerfile stage with rootless buildkit and push it.
  params:
  - name: image
    type: string
    description: Reference to push, with its tag.
  - name: dockerfile
    type: string
    description: Workspace-relative Dockerfile.
  - name: context
    type: string
    description: Workspace-relative build context.
  - name: target
    type: string
    description: Dockerfile stage to build.
  - name: build-args
    type: array
    description: KEY=VALUE build arguments.
    default: []
  workspaces:
  - name: source
    description: The checkout.
  - name: dockerconfig
    description: 'Registry credentials: a docker config.json.'
    optional: true
  results:
  - name: digest
    type: string
    description: Digest of the pushed image.
  steps:
  - name: build
    image: moby/buildkit:v0.33.0-rootless
    computeResources: {}
    env:
    - name: IMAGE
      value: $(params.image)
    - name: DOCKERFILE
      value: $(params.dockerfile)
    - name: CONTEXT
      value: $(params.context)
    - name: TARGET
      value: $(params.target)
    - name: DOCKERCONFIG_BOUND
      value: $(workspaces.dockerconfig.bound)
    - name: DOCKERCONFIG_PATH
      value: $(workspaces.dockerconfig.path)
    - name: DIGEST_PATH
      value: $(results.digest.path)
    - name: BUILDKITD_FLAGS
      value: --oci-worker-no-process-sandbox
    script: |
      #!/bin/sh
      set -eu
      if [ "$DOCKERCONFIG_BOUND" = true ]; then export DOCKER_CONFIG="$DOCKERCONFIG_PATH"; fi
      # "$@" is the build-args param: one KEY=VALUE per entry.
      n=$#
      while [ "$n" -gt 0 ]; do set -- "$@" --opt "build-arg:$1"; shift; n=$((n - 1)); done
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context="$CONTEXT" \
        --local dockerfile="$(dirname "$DOCKERFILE")" \
        --opt filename="$(basename "$DOCKERFILE")" \
        --opt target="$TARGET" \
        "$@" \
        --output type=image,name="$IMAGE",push=true \
        --metadata-file /tmp/metadata.json
      sed -n 's/.*"containerimage.digest": *"\([^"]*\)".*/\1/p' /tmp/metadata.json | tr -d '\n' > "$DIGEST_PATH"
      test -s "$DIGEST_PATH" || { echo 'buildctl reported no image digest' >&2; exit 1; }
    workingDir: $(workspaces.source.path)
    args:
    - $(params.build-args[*])
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      seccompProfile:
        type: Unconfined
      appArmorProfile:
        type: Unconfined
