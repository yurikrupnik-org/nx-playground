apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: butler-kubectl-apply
  labels:
    app.kubernetes.io/managed-by: butler
spec:
  description: Apply a rendered manifest with its image pinned to the digest just built.
  params:
  - name: manifest
    type: string
    description: Workspace-relative rendered manifest.
  - name: image
    type: string
    description: The image reference the manifest names, with its tag.
  - name: digest
    type: string
    description: Digest to pin that reference to.
  workspaces:
  - name: source
    description: The checkout.
  steps:
  - name: apply
    image: alpine/k8s:1.35.9
    computeResources: {}
    env:
    - name: MANIFEST
      value: $(params.manifest)
    - name: IMAGE
      value: $(params.image)
    - name: DIGEST
      value: $(params.digest)
    script: |
      #!/bin/sh
      set -eu
      pinned="${IMAGE%:*}@${DIGEST}"
      sed "s|image: ${IMAGE}\$|image: ${pinned}|" "$MANIFEST" > /tmp/manifest.yaml
      grep -q "image: ${pinned}\$" /tmp/manifest.yaml || { echo "$MANIFEST never names $IMAGE" >&2; exit 1; }
      kubectl apply -f /tmp/manifest.yaml
    workingDir: $(workspaces.source.path)
