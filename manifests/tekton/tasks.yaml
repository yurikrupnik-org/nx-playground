      grep " $archive\$" "$sums" | sha256sum -c -
      tar -xzf "$archive" "$member"
      if [ "$member" != task ]; then mv "$member" task; rm -rf "${member%%/*}"; fi
      rm "$archive" "$sums"
    volumeMounts:
    - name: butler-bin
      mountPath: /butler/bin
  - name: run
    image: oven/bun:1.4.2
    computeResources: {}
