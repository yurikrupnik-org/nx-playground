  labels:
    app.kubernetes.io/managed-by: butler
    butler/runner: nx
  annotations:
    butler/target: nx:zerg_vector:scan
spec:
  description: bun nx run zerg_vector:scan
  params:
  - name: url
    type: string
    description: Git URL to clone.
    default: https://github.com/yurikrupnik-org/nx-playground.git
  - name: revision
    type: string
    description: Branch, tag or commit to run.
    default: main
  - name: args
    type: array
    description: Extra arguments after the target.
    default: []
  workspaces:
  - name: source
    description: Scratch space for the checkout.
  tasks:
  - name: clone
    taskRef:
      name: butler-git-clone
      kind: Task
    params:
    - name: url
      value: $(params.url)
    - name: revision
      value: $(params.revision)
    workspaces:
    - name: source
      workspace: source
  - name: run
    runAfter:
    - clone
    taskRef:
      name: butler-nx
      kind: Task
    params:
    - name: project
      value: zerg_vector
    - name: target
      value: scan
    - name: args
      value:
      - $(params.args[*])
    workspaces:
    - name: source
      workspace: source
---
