  # =============================================================================
  # Rust Services (bacon for hot-reload)
  # Note: Start these manually after infra is ready (press 's' to start)
  # =============================================================================
  zerg-api:
    shell: "DATABASE_URL='postgres://myuser:mypassword@localhost:5432/zerg' bacon zerg-api"
    stop: "SIGTERM"
    # autostart: false

  zerg-tasks:
    shell: "DATABASE_URL='postgres://myuser:mypassword@localhost:5432/tasks' bacon zerg-tasks"
    stop: "SIGTERM"
    # autostart: false

  zerg-email:
    shell: "bacon zerg-email-nats"
    stop: "SIGTERM"
    # autostart: false

  # ---------------------------------------------------------------------------
  # Work-queue replica check (manual — `s` to start, intentionally not autostarted)
  #
  # These are a TEST HARNESS, not services. Normal dev uses `zerg-email` above;
  # leave these stopped unless you are checking replica behaviour, otherwise you
  # are just running three copies of the same worker.
  #
  # What they prove: a durable JetStream consumer is identified BY NAME, so both
  # replicas join the one `email-worker` group and each job is handled exactly
  # once. Were the name per-process, each replica would get its own cursor and
  # every email would be sent twice.
  #
  # How to run:
  #   1. start `email-replica-a` and `email-replica-b` (no env needed; they
  #      default to MailHog on localhost:1025)
  #   2. `just email-replica-check`  -> PASS: one job, one delivery
  #      `just email-scale-check`    -> same assertion under N jobs
  #
  # Both recipes purge the stream and clear MailHog first — a freshly created
  # consumer replays history, which would otherwise pollute the count.
  # ---------------------------------------------------------------------------
  email-replica-a:
    shell: "EMAIL_WORKER_HEALTH_PORT=8091 cargo run -p zerg_email_nats"
    stop: "SIGTERM"
    autostart: false

  email-replica-b:
    shell: "EMAIL_WORKER_HEALTH_PORT=8092 cargo run -p zerg_email_nats"
    stop: "SIGTERM"
    autostart: false

