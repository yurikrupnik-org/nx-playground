# Lefthook - Git hooks manager
# https://github.com/evilmartians/lefthook

# Pre-commit: Fast checks before each commit
pre-commit:
  parallel: true
  commands:
    # TypeScript/JavaScript formatting & linting
    biome-check:
      glob: "*.{js,ts,tsx,json}"
      run: bunx biome check --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    # Rust formatting check
    rustfmt:
      glob: "*.rs"
      run: cargo fmt -- --check

    # Rust linting (--all-targets so tests/benches are linted too, as `task lint-rust` does)
    clippy:
      glob: "*.rs"
      run: cargo clippy --workspace --all-targets -- -D warnings

# Pre-push: Thorough checks before pushing
pre-push:
  parallel: true
  commands:
    # Rust tests (nextest, matching `task test-rust`)
    cargo-test:
      run: cargo nextest run --workspace

    # Web lint: read-only, like CI. The per-app `lint` scripts are `biome check
    # --write` (mutating), so they must never run as a gate.
    biome-ci:
      run: bunx biome ci .

    # Security audit — must load the workspace policy (ignores + license allowlist)
    cargo-deny:
      run: cargo deny --config .cargo/deny.toml check

# Post-checkout: Sync after switching branches
post-checkout:
  commands:
    deps-sync:
      run: bun install --frozen-lockfile 2>/dev/null || true

# Post-merge: Sync after pulling/merging
post-merge:
  commands:
    deps-update:
      run: bun install --frozen-lockfile 2>/dev/null || true

# Commit message: Enforce conventional commits
commit-msg:
  commands:
    conventional:
      run: |
        msg=$(cat "$1")
        if ! echo "$msg" | grep -qE "^(feat|fix|docs|style|refactor|test|chore|build|ci|perf|revert)(\(.+\))?: .+"; then
          echo "Commit message must follow Conventional Commits format"
          echo "Example: feat(api): add user authentication"
          echo "Got: $msg"
          exit 1
        fi
