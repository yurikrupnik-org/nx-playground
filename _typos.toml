# Spell check over the whole tree — `just fmt` (rewrite) / `just fmt-check` (gate).
#
# Every entry below is a real word this repo uses, not a typo to be tolerated:
# keep the list short and justified, because `just fmt` runs `typos --write-changes`
# and an over-broad allowlist is the only thing standing between that and a
# silent rename of an identifier.

[files]
extend-exclude = [
    # Vendored, minified: htmx ships single-letter identifiers that collide
    # with half the dictionary (`Pn`, `ue`, `fo`).
    "apps/todo/web-htmx/assets/**",
    # Base64 key material (test_jwks.json) is not prose.
    "**/testdata/**",
]

[default]
extend-ignore-re = [
    # `mis-aligned`, `mis-spelling`: hyphenated prefix, split into its own word.
    '\bmis-[a-z]+',
    # `DELETEs it again`: verbed HTTP method, tokenised as DELET + s.
    '\bDELETEs\b',
]

[default.extend-words]
# `wrk` — the HTTP benchmarking tool (scripts/wrk).
wrk = "wrk"
# `uncomplete` — the todo domain's inverse of `complete`, in API paths,
# command names and event subjects. Renaming it is a wire change, not a typo fix.
uncomplete = "uncomplete"
# `unparseable` — the spelling used by the error variants already on the wire.
unparseable = "unparseable"
# `ratatui` — the TUI crate.
ratatui = "ratatui"
# `AKS` — Azure Kubernetes Service, beside GKE and EKS.
aks = "aks"
